<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maps · admin · Anoikis Traveler</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a12;--panel:#0e1424;--line:#24314c;--text:#e2e8f3;--dim:#8b98b0;--accent:#f2a74b;--ok:#5fd68a;--warn:#f2c94b;--bad:#ef5a5a;--gold:#e8c25a;
  --display:"Saira Condensed",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.5 var(--body)}
main{max-width:1180px;margin:0 auto;padding:26px 18px 60px}
h1{font:700 28px var(--display);letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px} h1 a{color:inherit;text-decoration:none} h1 b{color:var(--accent)}
h2{font:700 17px var(--display);letter-spacing:.08em;text-transform:uppercase;margin:22px 0 8px;color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin:12px 0}
.dim{color:var(--dim)} .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
button{font:600 13.5px var(--body);background:#141c30;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);color:#1a1004;border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13.5px} td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:500;cursor:pointer;white-space:nowrap} td.n{text-align:right;font-family:var(--mono)} code{font-family:var(--mono);color:var(--gold)}
.kpis{display:flex;gap:10px;flex-wrap:wrap}.kpi{background:#0b1120;border:1px solid var(--line);border-radius:6px;padding:8px 14px}.kpi b{display:block;font:700 22px var(--display)}
tr.hist td{background:#0b1120}
#who{float:right;color:var(--dim);font-size:13px}
</style>
</head>
<body><main>
  <span id="who"></span>
  <h1><a href="../">Anoikis <b>Traveler</b></a> · maps</h1>
  <p class="dim">For the site owner only: you log in with EVE like on the map, and the server only answers the owner's character.</p>
  <div class="card" id="login"><button type="button" class="primary" id="bLogin">Log in with EVE</button> <span id="msg" class="dim"></span></div>
  <div id="app" hidden>
    <div class="kpis" id="kpis"></div>
    <h2>Every map <button type="button" id="bRefresh" style="float:right">Refresh</button></h2>
    <div class="card" style="padding:6px 10px"><table id="maps"></table></div>
    <h2>Payments waiting for a map</h2>
    <div class="card" id="pending"></div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const SSO = 'https://login.eveonline.com/v2/oauth';
const ROOT = location.origin + location.pathname.replace(/admin\/(index\.html)?$/, '');
let site = {}, ws = null, seq = 0, data = null, sortK = 'until', open = new Set(); const wait = new Map();
const b64url = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
const isk = n => (Math.round(n / 1e5) / 10).toLocaleString() + ' M';
const when = t => t ? new Date(t).toLocaleString(undefined, { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
const left = ms => { if (ms <= 0) return 'ended'; const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5); return d ? `${d} d ${h} h` : `${h} h ${Math.floor(ms % 36e5 / 6e4)} min`; };

async function login(){
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  const state = 'ad' + b64url(crypto.getRandomValues(new Uint8Array(12)));      // "ad": the site root sends the answer back here
  sessionStorage.setItem('at.admin.pkce', JSON.stringify({ verifier, state }));
  location.href = `${SSO}/authorize/?` + new URLSearchParams({ response_type:'code', redirect_uri:ROOT, client_id:site.clientId, scope:'esi-location.read_location.v1', code_challenge:challenge, code_challenge_method:'S256', state });
}
function send(o){ return new Promise((res, rej) => { const id = ++seq; wait.set(id, { res, rej }); ws.send(JSON.stringify({ ...o, id })); setTimeout(() => { if (wait.has(id)){ wait.delete(id); rej(new Error('No answer from the server')); } }, 30000); }); }
function connect(access){
  return new Promise((res, rej) => {
    ws = new WebSocket(site.live.replace(/\/+$/, '').replace(/^http/, 'ws') + '/ws');
    ws.onmessage = ev => { if (ev.data === 'pong') return; let m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
      if (m.id != null && wait.has(m.id)){ const w = wait.get(m.id); wait.delete(m.id); m.ok ? w.res(m) : w.rej(new Error(m.error || 'Refused')); } };
    ws.onopen = () => send({ op:'auth', token:access }).then(res, rej);
    ws.onerror = () => rej(new Error('Live server unreachable'));
    setInterval(() => { try{ if (ws.readyState === 1) ws.send('ping'); }catch(e){} }, 45000);
  });
}
async function load(){
  data = (await send({ op:'adminMaps' })).data;
  const now = data.now, maps = data.maps, paid = maps.filter(m => m.paidUntil && m.paidUntil > now);
  $('#kpis').innerHTML = `<div class="kpi"><b>${maps.length}</b>maps</div><div class="kpi"><b>${paid.length}</b>paid now</div>
    <div class="kpi"><b>${maps.reduce((s, m) => s + m.members, 0)}</b>characters invited in all</div><div class="kpi"><b>${data.freeMax}</b>free characters per map</div>
    <div class="kpi"><b>${data.pending.length}</b>payments waiting</div><div class="kpi"><b style="font-size:15px">${data.status ? when(data.status.t) : '—'}</b>last wallet check</div>`;
  render();
  $('#pending').innerHTML = data.pending.length ? `<table><tr><th>Date</th><th>From</th><th>Amount</th><th>Reason</th></tr>${data.pending.map(p => `<tr><td>${when(p.date)}</td><td>${esc(p.from || p.fromId)}</td><td class="n">${isk(p.amount)}</td><td><code>${esc(p.reason)}</code>${p.note ? `<div class="dim">${esc(p.note)}</div>` : ''}</td></tr>`).join('')}</table><p class="dim" style="margin:8px 0 0">Assign them from the <a href="../pay/" style="color:var(--accent)">/pay/</a> page (Sava Yesh).</p>` : '<span class="dim">Nothing waiting.</span>';
}
function render(){
  const now = data.now, key = { name:m => m.name.toLowerCase(), members:m => -m.members, max:m => -(m.max ?? 1e9), until:m => m.site ? -2e15 : -(m.paidUntil || 0), seen:m => -(m.lastSeen || 0) }[sortK];
  const maps = data.maps.slice().sort((a, b) => key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0);
  const th = (k, t) => `<th data-k="${k}">${t}${sortK === k ? ' ▾' : ''}</th>`;
  let html = `<tr>${th('name', 'Map (owner)')}${th('members', 'Characters on it')}${th('max', 'Allowed')}<th>Plan</th>${th('until', 'Paid until')}<th>Time left</th>${th('seen', 'Last activity')}<th>Payments</th></tr>`;
  for (const m of maps){
    const active = m.paidUntil && m.paidUntil > now, over = m.max != null && m.members > m.max;
    html += `<tr><td><b>${esc(m.name)}</b><div class="dim" style="font-size:11.5px">${m.owner}</div></td>
      <td class="n${over ? ' bad' : ''}">${m.members}</td><td class="n">${m.site ? '∞' : m.max}</td>
      <td>${m.site ? '<span class="ok">site owner · free, no limit</span>' : active ? `<span class="ok">paid · up to ${m.paidMax}</span>` : m.paidUntil ? '<span class="warn">paid plan ended</span>' : '<span class="dim">free tier</span>'}</td>
      <td>${m.site ? '—' : when(m.paidUntil)}</td><td class="${active && m.paidUntil - now < 3 * 864e5 ? 'warn' : ''}">${m.site ? '—' : m.paidUntil ? left(m.paidUntil - now) : '—'}</td>
      <td>${when(m.lastSeen)}</td><td>${m.pays ? `<button type="button" data-h="${m.owner}">${open.has(m.owner) ? 'Hide' : 'History'} (${m.pays})</button>` : '<span class="dim">none</span>'}</td></tr>`;
    if (open.has(m.owner)) html += `<tr class="hist"><td colspan="8" id="h-${m.owner}"><span class="dim">Loading…</span></td></tr>`;
  }
  $('#maps').innerHTML = html;
  $('#maps').querySelectorAll('th[data-k]').forEach(t => t.onclick = () => { sortK = t.dataset.k; render(); });
  $('#maps').querySelectorAll('[data-h]').forEach(b => b.onclick = () => { const o = b.dataset.h; open.has(o) ? open.delete(o) : open.add(o); render(); });
  for (const o of open) loadHistory(o);
}
async function loadHistory(o){
  const box = document.getElementById('h-' + o); if (!box) return;
  try{
    const d = (await send({ op:'payHistory', owner:o })).data, total = d.pays.reduce((s, p) => s + p.amount, 0);
    box.innerHTML = `<b>Payments of ${esc(d.name)}</b> <span class="dim">· ${d.pays.length} · ${isk(total)} ISK in all</span>
      <table style="margin-top:6px"><tr><th>Date</th><th>Paid by</th><th>Amount</th><th>Reason</th><th>For</th><th>Weeks</th><th>Map paid until</th></tr>
      ${d.pays.map(p => `<tr><td>${when(p.date)}</td><td>${esc(p.from || p.fromId)}</td><td class="n">${isk(p.amount)}</td><td><code>${esc(p.reason)}</code></td><td>${p.max} characters</td><td class="n">${p.weeks}</td><td>${when(p.until)}</td></tr>`).join('')}</table>`;
  }catch(e){ box.innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
}
(async function init(){
  site = await (await fetch('../site.json', { cache:'no-store' })).json();
  $('#bLogin').onclick = login; $('#bRefresh').onclick = () => load().catch(e => alert(e.message));
  const q = new URLSearchParams(location.search);
  if (!q.has('code')){ $('#msg').textContent = 'Log in with your site owner character.'; return; }
  window.history.replaceState(null, '', location.pathname);
  const saved = JSON.parse(sessionStorage.getItem('at.admin.pkce') || 'null');
  if (!saved || saved.state !== q.get('state')){ $('#msg').textContent = 'Login interrupted, try again.'; return; }
  try{
    $('#msg').textContent = 'Checking with EVE…';
    const r = await fetch(`${SSO}/token`, { method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' }, body:new URLSearchParams({ grant_type:'authorization_code', code:q.get('code'), client_id:site.clientId, code_verifier:saved.verifier }) });
    if (!r.ok) throw new Error('EVE refused the login (' + r.status + ')');
    const t = await r.json(), a = await connect(t.access_token);
    $('#who').textContent = 'Logged in: ' + a.name;
    await load();
    $('#login').hidden = true; $('#app').hidden = false;
    setInterval(() => load().catch(() => {}), 120000);
  }catch(e){ $('#msg').innerHTML = `<span class="bad">${esc(e.message === 'Permission denied' ? 'This page is for the site owner only.' : e.message)}</span>`; }
})();
</script>
</body>
</html>
