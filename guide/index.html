<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anoikis Traveler · Wormhole Mapper for EVE Online</title>
<meta name="description" content="Anoikis Traveler: a private, shared wormhole mapper for EVE Online, free for everyone. Live chain tracking, Thera and Turnur routes, 3D view.">
<meta name="theme-color" content="#070a12">
<style>
:root{--bg:#070a12;--panel:#0e1424;--panel2:#141c30;--line:#24314c;--text:#e2e8f3;--dim:#8b98b0;--accent:#f2a74b;--ok:#5fd68a;--c2:#4f8de8;--eol:#c07cff;
  --display:"Saira Condensed","Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--body)}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
/* top bar */
header.top{position:sticky;top:0;z-index:10;background:rgba(7,10,18,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:18px;height:60px}
.brand{font:700 22px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--text);text-decoration:none;white-space:nowrap}
.brand b{color:var(--accent)}
nav.links{display:flex;gap:16px;margin-left:auto;font-size:14px}
nav.links a{color:var(--dim);text-decoration:none}nav.links a:hover{color:var(--text)}
.soon{margin-top:22px;border:1px dashed var(--accent);border-radius:10px;padding:16px 20px;background:var(--panel)}.soon h3{margin:0 0 6px;color:var(--accent)}.soon p{margin:0 0 8px;color:var(--dim)}.soon ul{margin:0;padding-left:20px}.soon li{margin:4px 0}
.langs{margin:-6px 0 18px;font-size:14px;color:var(--dim)}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:7px;padding:2px}
.lang button{font:600 12px var(--mono);background:none;border:0;color:var(--dim);padding:5px 8px;border-radius:5px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:#1b1206}
/* hero */
.hero{padding:70px 0 40px;background:radial-gradient(ellipse at 70% 0%,rgba(79,141,232,.18),transparent 60%),radial-gradient(ellipse at 10% 30%,rgba(242,167,75,.10),transparent 55%)}
.hero h1{font:700 clamp(40px,7vw,72px)/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 14px}
.hero h1 b{color:var(--accent)}
.hero .tag{font-size:clamp(18px,2.3vw,22px);color:var(--text);max-width:720px;margin:0 0 10px}
.hero .sub{color:var(--dim);max-width:720px;margin:0 0 26px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:8px;border:1px solid var(--line);color:var(--text);background:var(--panel2)}
.btn.don{border-color:#2e6b4a;background:linear-gradient(135deg,#1d4a33,#173826);color:#bff2d3}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1206}
.btn:hover{filter:brightness(1.12)}
.shot{margin:40px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.shot img{display:block;width:100%;height:auto}
/* sections */
section{padding:64px 0;border-top:1px solid var(--line)}
h2{font:700 34px var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0 0 8px}
.lead{color:var(--dim);margin:0 0 30px;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card.new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;position:relative}.card .nb{position:absolute;top:12px;right:12px;background:var(--accent);color:#1b1206;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.card .ic{font-size:24px;line-height:1}
.card h3{margin:10px 0 6px;font-size:17px}
.card p{margin:0;color:var(--dim);font-size:14.5px}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:22px}
@media(max-width:520px){.gal{grid-template-columns:1fr}}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
figure img{display:block;width:100%;height:auto;cursor:zoom-in}
figcaption{padding:12px 14px;color:var(--dim);font-size:14px}
figcaption b{color:var(--text)}
/* tutorial */
.steps{counter-reset:s;display:grid;gap:14px}
.step{counter-increment:s;display:grid;grid-template-columns:52px 1fr;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.step::before{content:counter(s);display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--panel2);border:1px solid var(--accent);color:var(--accent);font:700 20px var(--display)}
.step h3{margin:2px 0 6px;font-size:18px}
.step p,.step li{color:var(--dim);margin:0 0 6px;font-size:15px}
.step ul{margin:4px 0 0;padding-left:20px}
.step b,.step strong{color:var(--text)}
kbd{font:600 12.5px var(--mono);background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--text)}
.k{font:600 13px var(--mono);border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--text);white-space:nowrap}
.k.gold{color:#f5c542;border-color:#7a6220}.k.ok{color:var(--ok);border-color:#24533a}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin:8px 0 2px;font-size:14px;color:var(--dim)}
.legend i{display:block;width:34px;height:0;border-top:3px solid #8fb2e8}
.legend i.mass{border-top-style:dashed;border-color:#f2c94b}.legend i.crit{border-top-style:dotted;border-color:#ef5a5a}.legend i.eol{border-color:var(--eol)}.legend i.gate{border-top:2px dotted #6b7890}
/* request + support */
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
.box h3{margin:0 0 10px;font-size:20px}
.box ol{margin:0;padding-left:22px;color:var(--dim)}.box ol li{margin:0 0 8px}.box ol b{color:var(--text)}
.box p{color:var(--dim)}
.box.why{margin-top:20px;border-color:#5a4420;background:linear-gradient(135deg,#1a150c,#121722)}.box.why p{margin:0 0 8px}.box.why b{color:var(--text)}
.box.isk{border-color:#24533a;background:linear-gradient(135deg,#0f1d16,#121722)}
.box.raf{border-color:#2a3d66;background:linear-gradient(135deg,#0f1628,#121722)}
.copy{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.copy code{font:600 17px var(--mono);color:var(--ok);background:#0b1a12;border:1px solid #24533a;border-radius:6px;padding:6px 10px}
button.small{font:inherit;font-size:14px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.mini{font-size:13px;color:var(--dim)}
/* faq */
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:0 0 10px}
summary{cursor:pointer;font-weight:600}
details p{color:var(--dim);margin:10px 0 0}
footer{border-top:1px solid var(--line);padding:30px 0 44px;color:var(--dim);font-size:13px}
/* lightbox */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:50;cursor:zoom-out;padding:20px}
#lb.on{display:grid}#lb img{max-width:100%;max-height:100%;border-radius:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--ok);color:var(--ok);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
@media(max-width:760px){nav.links{display:none}.lang{margin-left:auto}}
@media(max-width:430px){.brand{font-size:17px}header.top .wrap{gap:10px;padding:0 12px}.lang button{padding:5px 6px}}
section,.hero{scroll-margin-top:64px}
table.prices{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:15px}
table.prices th,table.prices td{text-align:left;padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.1)}
table.prices th{font-weight:600;opacity:.8}
table.prices td:nth-child(n+2),table.prices th:nth-child(n+2){text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
</style>
</head>

s2_p:'<p>Every jump adds the new system and the connection you took. Your system is marked <b>▼ You</b>, and your corpmates appear on their own systems.</p><p>The <b>Pilots</b> panel lists everyone: a green dot means their map is open, the <span class="k ok">EVE</span> badge means they are in game.</p>',
s3_t:'Read a system',
s3_p:'<p>Click a system to see its class, statics, effect, kills in the last hour, the route from you and shared notes for your group (residents, structures, dangers).</p><p>Move around: drag a system to place it, wheel to zoom, drag the background to pan. <span class="k">Recenter</span> brings the view back to the selected system.</p>',
s4_t:'Paste your signatures',
s4_p:'<p>In the in-game probe scanner press <kbd>Ctrl</kbd>+<kbd>A</kbd> then <kbd>Ctrl</kbd>+<kbd>C</kbd>, and paste into the system\'s <b>Signatures</b> box, then click <span class="k">Import</span>. Tick <i>Remove signatures that are gone</i> to clean up old ones.</p>',
s5_t:'Mark your connections',
s5_p:'<p>Click a connection to set the hole type (e.g. H296), its mass and end of life. The mass calculator and <b>Add a pass</b> track how much mass is left, for the whole group.</p>',
lg_stable:'Stable wormhole',lg_mass:'Mass reduced',lg_crit:'Mass critical',lg_eol:'End of life (EOL)',lg_gate:'Stargate',
s6_t:'ENTER, EXIT and Home',
s6_p:'<p><b>Right-click</b> a system → <span class="k gold">Set as ENTER</span> to mark it as the way in, or <span class="k ok">Set as EXIT</span> as the way home. Right-click it again to remove the mark. <span class="k">Home</span> sets your base and <span class="k">My location</span> jumps the view to you.</p>',
s7_t:'Thera, Turnur and trade hubs',
s7_p:'<p>The <span class="k">🌀 Thera / Turnur</span> button shows or hides the hubs; they appear by themselves when your chain links to them. In the right panel:</p><ul><li><b>Thera / Turnur</b>: every exit, sorted by jumps from your current system, without going through the other hub; a shortcut through the other hub is shown only when it is shorter.</li><li><b>Routes to trade hubs</b>: shortest, safest, and shortest avoiding both hubs.</li></ul>',
s8_t:'Send a route to EVE',
s8_p:'<p>In a system\'s panel, <span class="k">Set destination</span> or <span class="k">Add waypoint</span> sends the route straight to your EVE client (needs the waypoint permission).</p>',
s9_t:'3D view and assets',
s9_p:'<p><span class="k">3D view</span> rotates the chain around the selected system: drag to rotate, <kbd>Shift</kbd>+drag to pan, wheel to zoom.</p><p><span class="k">📦 Assets</span> marks the systems where your characters have assets. After each wormhole jump, a window lists the ones within the range you choose.</p>',
s10_t:'Share with your group',
s10_p:'<p>The map owner opens <span class="k">Access</span> and invites other characters, with edit or read-only rights: up to <b>10 characters</b> per map, owner included (more would create hosting costs for the site owner; more is possible on request, on quote). They log in on the same page and land on your map automatically. Nobody else can see it.</p>',s11_t:'Market nearby',s11_p:'<p>In the right panel, open <b>🛒 My market products</b>: browse the EVE market categories or search, and <b>click a product</b> to add it (✓). Click it again to remove it. Your list has no limit and stays saved in this browser.</p><p><b>Right-click</b> a k-space system of your chain (high-sec, low-sec, nullsec, Pochven) → <span class="k">🛒 Market nearby</span>. Pick a range (this system only, up to 5 jumps) and click <span class="k">Search prices</span>. For each product: <b>Best sell</b> = the cheapest price to buy, <b>Best buy</b> = the highest price you can sell at, with the system, the jumps and the quantity (“structure” = player citadel). Click a system name to set it as destination in game.</p>',s12_t:'Activity (NPC kills)',s12_p:'<p><b>Right-click</b> a low-sec or nullsec system → <span class="k">💰 Activity (NPC kills)</span>. Pick a range (1 to 5 jumps) and click <span class="k">Estimate</span>. The window lists the low-sec and nullsec systems in range, most active first: jumps, <b>NPC/h</b> (NPCs killed in the last hour, CCP data; green above 300, yellow above 100) and <b>≈ ISK/h</b>.</p><p>The ISK figure is an <b>estimate only</b> of what the system\'s ESS collects per hour: EVE does not publish ESS content. Low-sec and NPC nullsec have no ESS. The Main Bank pays out about every 3 hours, so it can hold up to about 3 times the hourly figure. Click a system name to open it on DOTLAN.</p>',s13_t:'Danger alerts',s13_p:'<p>Systems of your chain with kills in the last hour are marked on the map. As soon as a system has <b>a kill in the last 10 minutes</b>, it switches to alarm. Click the system: its panel lists the latest kills (ship, how long ago), each one opening on zKillboard.</p>',s14_t:'Support the site',s14_p:'<p>Anoikis Traveler is free. The <span class="k">❤️ Donate</span> button (top bar) and the green box in the right panel explain how to help: copy the name <b>Sava Yesh</b>, search the character in EVE, right-click → <b>Give Money</b>. Any amount helps keep the servers running.</p>',
req_title:'Get your own map',req_lead:'Create it yourself in one click. It is free.',
req_how:'How to create it',req_open:'Open the map',
req_steps:'<li>Open the map and log in with EVE with the character that will <b>own</b> your group\'s map (usually your corporation\'s director).</li><li>Click <b>Create my map</b>: your map opens right away.</li><li>Invite your group from <b>Access</b>: up to 10 characters per map, you included (more on request, on quote).</li><li>If it helps your group, a donation in ISK to <b>Sava Yesh</b> keeps the site online.</li>',
req_what:'Good to know',req_what_p:'<p>One map per character. The character who creates the map owns it and manages its members. Nothing to install, no mail to send.</p>',
copy_name:'Copy name',copy_subject:'Copy subject',copied:'Copied',
faq_title:'FAQ',
q1:'How much does it cost?',a1:'Nothing: Anoikis Traveler is free, with no ads. Each map holds up to 10 characters: more would create hosting costs for the site owner. Need more? Ask for a quote by EVE mail to Sava Yesh. Donations in ISK to Sava Yesh help keep it online.',
q2:'Is my account safe?',a2:'You log in on CCP\'s official EVE SSO page, so the map never sees your password. It only reads what you allow (location, ship, assets) and can only write waypoints. You can revoke access at any time on the EVE website, under third-party applications.',
q3:'Who can see my map?',a3:'Only the owner and the characters they invite. Each group\'s map is private.',
q4:'Do I need to install anything?',a4:'No. It runs in your web browser, best on a computer next to your EVE client.',
q5:'Is it allowed by CCP?',a5:'It uses CCP\'s official ESI interface, like other third-party EVE tools. It is a fan project, not affiliated with or endorsed by CCP.',
why_t:'Free, thanks to donations',why_p:'<p>The map, the market and activity tools, and the fitting tool to come are <b>free for everyone</b>. Servers and development are paid by one player.</p><p>If the map saves you time (or your pod), send a few ISK in game to <b>Sava Yesh</b>: search the character, right-click → <b>Give Money</b>. Any amount helps. <a href="#support">How to donate</a></p>',
q7:'How can I help?',a7:'Send ISK in game to Sava Yesh (search the character, right-click → Give Money), share the map with other wormholers, or join EVE with our recruitment link if you are new. Donations give no extra access: everyone gets the same map.',
q6:'Where does the Thera and Turnur data come from?',a6:'From EVE-Scout, run by Signal Cartel, refreshed every 5 minutes.',
sup_title:'Support the project',sup_lead:'Anoikis Traveler has no ads. If you like it, here are two ways to help.',
isk_t:'Send ISK',isk_p:'In EVE, search the character below, right-click → <b>Give Money</b>. Any amount helps keep the map online.',isk_note:'Donating gives no extra access: everyone gets the same map.',
raf_t:'New to EVE? Join with our link',raf_p:'Create your EVE Online account through our Recruit a Friend link: you get CCP\'s welcome bonus and it supports the project.',raf_btn:'Create an EVE account',raf_note:'Official CCP Recruit a Friend programme. Rewards are set by CCP.',
rights:'All rights reserved.',ccp:'EVE Online and all related names and images are the property of CCP hf. This tool is not affiliated with or endorsed by CCP hf.'
},
fr:{
nav_features:'Fonctions',nav_tutorial:'Tutoriel',nav_request:'Avoir une carte',nav_faq:'FAQ',nav_support:'Soutenir',
hero_tag:'Une carte de wormholes partagée pour EVE Online, qui suit votre trace à travers Anoikis.',
hero_sub:'Connectez-vous avec EVE et volez : chaque saut s\'ajoute en direct à la carte de votre groupe. Connexions Thera et Turnur, routes vers les hubs de commerce, marchés à proximité et vue 3D sont inclus. Privé, rien à installer, et gratuit.',
btn_demo:'Essayer la démo',btn_open:'Ouvrir la carte',btn_request:'Avoir sa propre carte',btn_support:'❤️ Soutenir le site',
alt_overview:'Anoikis Traveler affichant une chaîne de wormholes avec les pilotes, les connexions et le panneau Thera',
feat_title:'Fonctions',feat_langs:'🌐 Ce guide : English · Français · Deutsch · Español. La carte est en anglais pour le moment.',soon_t:'🚧 Bientôt disponible',soon_p:'D\'autres outils sont en préparation et seront bientôt accessibles ici :',soon_1:'<b>Outil de fitting</b> : préparer et vérifier ses fits hors du jeu, avec ses compétences, les prix et l\'envoi des fits dans EVE.',soon_2:'<b>Routes commerciales</b> : trouver les bonnes affaires à acheter ici et revendre là-bas, entre les marchés.',soon_3:'Et d\'autres à venir, selon les besoins des pilotes.',feat_lead:'Tout ce qu\'un groupe wormhole utilise pour scanner, fermer des trous et rentrer, sur un seul écran.',
f1_t:'Suivi automatique',f1_p:'La carte suit votre personnage : chaque système où vous sautez est ajouté avec sa connexion, en direct.',
f2_t:'Partagée avec le groupe',f2_p:'Tout le monde voit la même chaîne et la position de chaque pilote. Vert : carte ouverte ; badge EVE : en jeu.',
f3_t:'Détail des connexions',f3_p:'Type de trou, état de masse, fin de vie, calculateur de masse et journal des passages partagé avec tout le groupe.',
f4_t:'Thera et Turnur',f4_p:'Données EVE-Scout en direct. Les hubs restent à l\'écart et ne rejoignent votre chaîne que si vous y êtes connecté.',
f5_t:'Routes vers les hubs',f5_p:'Jita, Amarr, Dodixie, Rens et Hek : la route la plus courte, la plus sûre, et la plus courte sans passer par Thera ni Turnur.',
f6_t:'Alertes de danger',f6_p:'Les kills récents sont signalés sur la carte, avec une alarme dès qu\'un système a un kill dans les 10 dernières minutes.',
f7_t:'Vue 3D',f7_p:'Faites tourner la chaîne en 3D autour du système sélectionné pour lire les grandes chaînes d\'un coup d\'œil.',
f8_t:'Assets et destination',f8_p:'Voyez où vos personnages ont des assets, recevez un rappel après chaque saut, et envoyez une route directement dans votre client EVE.',new_b:'Nouveau',f9_t:'Marché à proximité',f9_p:'Clic droit sur un système de l\'espace connu de votre chaîne → Market nearby : meilleurs prix d\'achat et de vente à 0 à 5 sauts pour votre propre liste de produits, choisie dans tout le marché EVE. Un clic sur un système l\'envoie comme destination dans le jeu.',f10_t:'Activité (PNJ tués)',f10_p:'Votre trou débouche en low-sec ou en 0.0 ? Clic droit sur le système → Activity (NPC kills), choisissez une portée en sauts et voyez les systèmes low-sec et 0.0 autour, avec leurs PNJ tués dans la dernière heure et une estimation de ce que leur ESS accumule (en 0.0 seulement). Une estimation : EVE ne publie pas le contenu des ESS.',
shots_title:'Captures d\'écran',shots_lead:'Prises dans la démo, que vous pouvez essayer sans vous connecter.',
cap_system:'Un système sélectionné et son détail',cap_system_html:'<b>Détail d\'un système.</b> Cliquez sur un système : classe, région, kills récents, notes partagées, signatures et route depuis vous.',
cap_thera:'Thera reliée à la chaîne',cap_thera_html:'<b>Thera et Turnur.</b> Chaque sortie avec sa taille, son temps restant et le nombre de sauts depuis votre système.',
cap_3d:'La vue 3D',cap_3d_html:'<b>Vue 3D.</b> La chaîne tourne autour du système sélectionné ; les sorties des hubs sont réparties en hauteur.',
cap_chain:'Une chaîne de wormholes',cap_chain_html:'<b>La chaîne.</b> Les couleurs indiquent la classe des systèmes, le style des traits l\'état de chaque connexion.',
tut_title:'Tutoriel',tut_lead:'Quatorze étapes, de la première connexion au marché et à l\'activité en 0.0. Vous pouvez essayer l\'essentiel d\'abord dans la démo.',
s1_t:'Se connecter avec EVE',
s1_p:'<p>Cliquez sur <span class="k">EVE login</span>. Vous vous connectez sur la page officielle de CCP : la carte ne voit jamais votre mot de passe.</p><p>Acceptez les autorisations : <b>position, statut en ligne et vaisseau</b> servent à vous suivre. <b>Waypoints, assets et structures</b> sont facultatifs et activent les fonctions correspondantes.</p>',
s2_t:'Volez : votre trace se dessine',
s2_p:'<p>Chaque saut ajoute le nouveau système et la connexion empruntée. Votre système est marqué <b>▼ You</b>, et vos camarades apparaissent sur leur propre système.</p><p>Le panneau <b>Pilots</b> liste tout le monde : point vert = carte ouverte, badge <span class="k ok">EVE</span> = en jeu.</p>',
s3_t:'Lire un système',
s3_p:'<p>Cliquez sur un système pour voir sa classe, ses statics, son effet, les kills de la dernière heure, la route depuis vous et les notes partagées du groupe (résidents, structures, dangers).</p><p>Pour vous déplacer : glissez un système pour le placer, molette pour zoomer, glissez le fond pour bouger la vue. <span class="k">Recenter</span> recentre sur le système sélectionné.</p>',
s4_t:'Coller vos signatures',
s4_p:'<p>Dans le scanner de sondes du jeu, faites <kbd>Ctrl</kbd>+<kbd>A</kbd> puis <kbd>Ctrl</kbd>+<kbd>C</kbd>, collez dans la case <b>Signatures</b> du système, puis cliquez sur <span class="k">Import</span>. Cochez <i>Remove signatures that are gone</i> pour effacer les anciennes.</p>',
s5_t:'Renseigner les connexions',
s5_p:'<p>Cliquez sur une connexion pour indiquer le type de trou (ex. H296), sa masse et sa fin de vie. Le calculateur de masse et <b>Add a pass</b> suivent la masse restante, pour tout le groupe.</p>',
lg_stable:'Wormhole stable',lg_mass:'Masse réduite',lg_crit:'Masse critique',lg_eol:'Fin de vie (EOL)',lg_gate:'Portail stellaire',
s6_t:'ENTER, EXIT et Home',
s6_p:'<p><b>Clic droit</b> sur un système → <span class="k gold">Set as ENTER</span> pour le marquer comme l\'entrée, ou <span class="k ok">Set as EXIT</span> comme la sortie pour rentrer. Un nouveau clic droit permet de retirer la marque. <span class="k">Home</span> définit votre base et <span class="k">My location</span> ramène la vue sur vous.</p>',
s7_t:'Thera, Turnur et hubs de commerce',
s7_p:'<p>Le bouton <span class="k">🌀 Thera / Turnur</span> affiche ou masque les hubs ; ils apparaissent d\'eux-mêmes quand votre chaîne s\'y relie. Dans le panneau de droite :</p><ul><li><b>Thera / Turnur</b> : chaque sortie, triée par nombre de sauts depuis votre système, sans passer par l\'autre hub ; un raccourci par l\'autre hub n\'apparaît que s\'il est plus court.</li><li><b>Routes to trade hubs</b> : la plus courte, la plus sûre, et la plus courte sans aucun des deux hubs.</li></ul>',
s8_t:'Envoyer une route dans EVE',
s8_p:'<p>Dans le panneau d\'un système, <span class="k">Set destination</span> ou <span class="k">Add waypoint</span> envoie la route directement dans votre client EVE (autorisation waypoints nécessaire).</p>',
s9_t:'Vue 3D et assets',
s9_p:'<p><span class="k">3D view</span> fait tourner la chaîne autour du système sélectionné : glisser pour tourner, <kbd>Maj</kbd>+glisser pour déplacer, molette pour zoomer.</p><p><span class="k">📦 Assets</span> marque les systèmes où vos personnages ont des assets. Après chaque saut de wormhole, une fenêtre liste ceux qui sont à la portée choisie.</p>',
s10_t:'Partager avec le groupe',
s10_p:'<p>Le propriétaire de la carte ouvre <span class="k">Access</span> et invite d\'autres personnages, en modification ou en lecture seule : jusqu\'à <b>10 personnages</b> par carte, propriétaire compris (au-delà, l\'hébergement coûterait au propriétaire du site ; davantage possible sur devis). Ils se connectent sur la même page et arrivent directement sur votre carte. Personne d\'autre ne la voit.</p>',s11_t:'Marché à proximité',s11_p:'<p>Dans le panneau de droite, ouvrez <b>🛒 My market products</b> : parcourez les catégories du marché EVE ou cherchez, et <b>cliquez sur un produit</b> pour l\'ajouter (✓). Un second clic le retire. La liste n\'a pas de limite et reste enregistrée dans ce navigateur.</p><p><b>Clic droit</b> sur un système de l\'espace connu de votre chaîne (haute sécurité, low-sec, 0.0, Pochven) → <span class="k">🛒 Market nearby</span>. Choisissez la portée (ce système seulement, jusqu\'à 5 sauts) et cliquez sur <span class="k">Search prices</span>. Pour chaque produit : <b>Best sell</b> = le prix le plus bas pour acheter, <b>Best buy</b> = le prix le plus haut auquel vous pouvez revendre, avec le système, les sauts et la quantité (« structure » = citadelle de joueurs). Un clic sur le nom d\'un système l\'envoie comme destination dans le jeu.</p>',s12_t:'Activité (PNJ tués)',s12_p:'<p><b>Clic droit</b> sur un système low-sec ou 0.0 → <span class="k">💰 Activity (NPC kills)</span>. Choisissez la portée (1 à 5 sauts) et cliquez sur <span class="k">Estimate</span>. La fenêtre liste les systèmes low-sec et 0.0 à portée, les plus actifs d\'abord : sauts, <b>NPC/h</b> (PNJ tués dans la dernière heure, données CCP ; en vert au-delà de 300, en jaune au-delà de 100) et <b>≈ ISK/h</b>.</p><p>Le chiffre en ISK n\'est qu\'une <b>estimation</b> de ce que l\'ESS du système accumule par heure : EVE ne publie pas le contenu des ESS. Le low-sec et le 0.0 tenu par les PNJ n\'ont pas d\'ESS. La banque principale verse son contenu environ toutes les 3 heures : elle peut donc contenir jusqu\'à environ 3 fois le chiffre horaire. Un clic sur le nom d\'un système l\'ouvre sur DOTLAN.</p>',s13_t:'Alertes de danger',s13_p:'<p>Les systèmes de votre chaîne avec des kills dans la dernière heure sont signalés sur la carte. Dès qu\'un système a <b>un kill dans les 10 dernières minutes</b>, il passe en alarme. Cliquez sur le système : son panneau liste les derniers kills (vaisseau, il y a combien de temps), chacun s\'ouvrant sur zKillboard.</p>',s14_t:'Soutenir le site',s14_p:'<p>Anoikis Traveler est gratuit. Le bouton <span class="k">❤️ Donate</span> (barre du haut) et l\'encart vert du panneau de droite expliquent comment aider : copiez le nom <b>Sava Yesh</b>, cherchez le personnage dans EVE, clic droit → <b>Give Money</b>. Chaque montant aide à faire tourner les serveurs.</p>',
req_title:'Avoir sa propre carte',req_lead:'Créez-la vous-même en un clic. C\'est gratuit.',
req_how:'Comment la créer',req_open:'Ouvrir la carte',
req_steps:'<li>Ouvrez la carte et connectez-vous avec EVE avec le personnage qui sera <b>propriétaire</b> de la carte du groupe (en général le directeur de la corporation).</li><li>Cliquez sur <b>Create my map</b> : votre carte s\'ouvre aussitôt.</li><li>Invitez votre groupe depuis <b>Access</b> : jusqu\'à 10 personnages par carte, vous compris (davantage sur devis).</li><li>Si elle rend service à votre groupe, un don en ISK à <b>Sava Yesh</b> aide à garder le site en ligne.</li>',
req_what:'Bon à savoir',req_what_p:'<p>Une carte par personnage. Le personnage qui crée la carte en est propriétaire et gère ses membres. Rien à installer, aucun mail à envoyer.</p>',
copy_name:'Copier le nom',copy_subject:'Copier l\'objet',copied:'Copié',
faq_title:'Questions fréquentes',
q1:'Combien ça coûte ?',a1:'Rien : Anoikis Traveler est gratuit et sans publicité. Chaque carte accueille jusqu\'à 10 personnages : au-delà, l\'hébergement coûterait au propriétaire du site. Besoin de plus ? Demandez un devis par EVE mail à Sava Yesh. Les dons en ISK à Sava Yesh aident à le garder en ligne.',
q2:'Mon compte est-il en sécurité ?',a2:'Vous vous connectez sur la page officielle EVE SSO de CCP : la carte ne voit jamais votre mot de passe. Elle lit seulement ce que vous autorisez (position, vaisseau, assets) et ne peut écrire que des waypoints. Vous pouvez retirer l\'accès à tout moment sur le site d\'EVE, rubrique applications tierces.',
q3:'Qui peut voir ma carte ?',a3:'Seulement le propriétaire et les personnages qu\'il invite. La carte de chaque groupe est privée.',
q4:'Faut-il installer quelque chose ?',a4:'Non. Tout se passe dans le navigateur, idéalement sur ordinateur à côté du client EVE.',
q5:'Est-ce autorisé par CCP ?',a5:'La carte utilise l\'interface officielle ESI de CCP, comme les autres outils tiers d\'EVE. C\'est un projet de fan, non affilié à CCP ni approuvé par CCP.',
why_t:'Gratuit, grâce aux dons',why_p:'<p>La carte, les outils de marché et d\'activité, et l\'outil de fitting à venir sont <b>gratuits pour tous</b>. Les serveurs et le développement sont payés par un seul joueur.</p><p>Si la carte vous fait gagner du temps (ou sauve votre pod), envoyez quelques ISK en jeu à <b>Sava Yesh</b> : cherchez le personnage, clic droit → <b>Give Money</b>. Chaque montant compte. <a href="#support">Comment faire un don</a></p>',
q7:'Comment aider ?',a7:'Envoyez des ISK en jeu à Sava Yesh (cherchez le personnage, clic droit → Give Money), faites connaître la carte à d\'autres wormholers, ou rejoignez EVE avec notre lien de parrainage si vous débutez. Un don ne donne aucun accès en plus : tout le monde a la même carte.',
q6:'D\'où viennent les données Thera et Turnur ?',a6:'D\'EVE-Scout, tenu par Signal Cartel, mis à jour toutes les 5 minutes.',
sup_title:'Soutenir le projet',sup_lead:'Anoikis Traveler est sans publicité. S\'il vous plaît, voici deux façons d\'aider.',
isk_t:'Envoyer des ISK',isk_p:'Dans EVE, cherchez le personnage ci-dessous, clic droit → <b>Give Money</b>. Chaque montant aide à garder la carte en ligne.',isk_note:'Un don ne donne aucun accès en plus : tout le monde a la même carte.',
raf_t:'Nouveau sur EVE ? Rejoignez-nous',raf_p:'Créez votre compte EVE Online avec notre lien de parrainage : vous recevez le bonus de bienvenue de CCP et vous soutenez le projet.',raf_btn:'Créer un compte EVE',raf_note:'Programme officiel de parrainage de CCP. Les récompenses sont fixées par CCP.',
rights:'Tous droits réservés.',ccp:'EVE Online ainsi que les noms et images associés sont la propriété de CCP hf. Cet outil n\'est ni affilié à CCP hf, ni approuvé par CCP hf.'
},

nav_features:'Funktionen',nav_tutorial:'Anleitung',nav_request:'Eigene Karte',nav_faq:'FAQ',nav_support:'Unterstützen',
hero_tag:'Ein gemeinsamer Wurmloch-Mapper für EVE Online, der deiner Spur durch Anoikis folgt.',
hero_sub:'Mit EVE einloggen und losfliegen: Jeder Sprung landet live auf der Karte deiner Gruppe. Thera- und Turnur-Verbindungen, Routen zu den Handelszentren, Märkte in der Nähe und eine 3D-Ansicht sind dabei. Privat, nichts zu installieren und kostenlos.',

alt_overview:'Anoikis Traveler mit einer Wurmlochkette, Piloten, Verbindungen und dem Thera-Bereich',
feat_langs:'🌐 Dieser Guide: English · Français · Deutsch · Español. Die Karte ist vorerst auf Englisch.',soon_t:'🚧 Demnächst',soon_p:'Weitere Werkzeuge sind in Vorbereitung und bald hier verfügbar:',soon_1:'<b>Fitting-Tool</b>: Fits außerhalb des Spiels bauen und prüfen, mit deinen Skills, Preisen und Übertragung der Fits ins Spiel.',soon_2:'<b>Handelsrouten</b>: gute Geschäfte finden, hier kaufen und dort verkaufen, zwischen den Märkten.',soon_3:'Und mehr folgt, je nach Wünschen der Piloten.',feat_title:'Funktionen',feat_lead:'Alles, was eine Wurmloch-Gruppe zum Scannen, Rollen und Heimkommen braucht, auf einem Bildschirm.',
f1_t:'Automatisches Tracking',f1_p:'Die Karte folgt deinem Charakter: Jedes System, in das du springst, wird samt Verbindung live hinzugefügt.',
f2_t:'Mit der Gruppe geteilt',f2_p:'Alle sehen dieselbe Kette und wo jeder Pilot ist. Grün heißt Karte offen, das EVE-Abzeichen heißt im Spiel.',
f3_t:'Verbindungsdetails',f3_p:'Wurmlochtyp, Massezustand, Lebensende, Masserechner und ein Protokoll der Durchflüge für die ganze Gruppe.',
f4_t:'Thera & Turnur',f4_p:'Live-Daten von EVE-Scout. Die Hubs bleiben außen vor und kommen erst in deine Kette, wenn du mit ihnen verbunden bist.',
f5_t:'Routen zu Handelszentren',f5_p:'Jita, Amarr, Dodixie, Rens und Hek: kürzeste Route, sicherste Route und kürzeste Route ohne Thera und Turnur.',
f6_t:'Gefahrenwarnungen',f6_p:'Aktuelle Kills werden auf der Karte markiert, mit Alarm, sobald ein System einen Kill in den letzten 10 Minuten hat.',
f7_t:'3D-Ansicht',f7_p:'Drehe die Kette in 3D um das ausgewählte System, um auch große Ketten auf einen Blick zu lesen.',
f8_t:'Assets & Ziel',f8_p:'Sieh, wo deine Charaktere Assets haben, erhalte nach jedem Sprung einen Hinweis und schicke Routen direkt an deinen EVE-Client.',new_b:'Neu',f9_t:'Markt in der Nähe',f9_p:'Rechtsklick auf ein K-Space-System deiner Kette → Market nearby: beste Kauf- und Verkaufspreise in 0 bis 5 Sprüngen für deine eigene Produktliste, gewählt aus dem ganzen EVE-Markt. Ein Klick auf ein System setzt es als Ziel im Spiel.',f10_t:'Aktivität (NPC-Kills)',f10_p:'Dein Loch öffnet sich ins Lowsec oder Nullsec? Rechtsklick auf das System → Activity (NPC kills), wähle eine Reichweite in Sprüngen und sieh die Lowsec- und Nullsec-Systeme ringsum mit ihren NPC-Kills der letzten Stunde und einer Schätzung dessen, was ihr ESS sammelt (nur Nullsec). Nur eine Schätzung: EVE veröffentlicht den ESS-Inhalt nicht.',
shots_title:'Screenshots',shots_lead:'Aus der Demo, die du ohne Login ausprobieren kannst.',
cap_system:'Ein ausgewähltes System mit Details',cap_system_html:'<b>Systemdetails.</b> Klicke auf ein System: Klasse, Region, aktuelle Kills, geteilte Notizen, Signaturen und die Route von dir aus.',
cap_thera:'Thera mit der Kette verbunden',cap_thera_html:'<b>Thera & Turnur.</b> Jeder Ausgang mit Größe, Restzeit und Sprüngen von deinem aktuellen System.',
cap_3d:'Die 3D-Ansicht',cap_3d_html:'<b>3D-Ansicht.</b> Die Kette dreht sich um das ausgewählte System; die Hub-Ausgänge sind in der Höhe verteilt.',
cap_chain:'Eine Wurmlochkette',cap_chain_html:'<b>Die Kette.</b> Farben zeigen die Systemklasse, Linienstile den Zustand jeder Verbindung.',
tut_title:'Anleitung',tut_lead:'Vierzehn Schritte, vom ersten Login bis zu Märkten und Nullsec-Aktivität. Das meiste lässt sich vorher in der Demo üben.',
s1_t:'Mit EVE einloggen',
s1_p:'<p>Klicke auf <span class="k">EVE login</span>. Du meldest dich auf der offiziellen Seite von CCP an: Die Karte sieht dein Passwort nie.</p><p>Bestätige die Berechtigungen: <b>Standort, Online-Status und Schiff</b> braucht die Karte, um dir zu folgen. <b>Wegpunkte, Assets und Strukturen</b> sind optional und schalten die passenden Funktionen frei.</p>',
s2_t:'Fliegen: deine Spur zeichnet sich selbst',
s2_p:'<p>Jeder Sprung fügt das neue System und die genutzte Verbindung hinzu. Dein System ist mit <b>▼ You</b> markiert, deine Corp-Kameraden erscheinen in ihren Systemen.</p><p>Der Bereich <b>Pilots</b> listet alle: grüner Punkt = Karte offen, Abzeichen <span class="k ok">EVE</span> = im Spiel.</p>',
s3_t:'Ein System lesen',
s3_p:'<p>Klicke auf ein System für Klasse, Statics, Effekt, Kills der letzten Stunde, die Route von dir und geteilte Notizen der Gruppe (Bewohner, Strukturen, Gefahren).</p><p>Navigation: System ziehen zum Platzieren, Mausrad zum Zoomen, Hintergrund ziehen zum Verschieben. <span class="k">Recenter</span> zentriert auf das ausgewählte System.</p>',
s4_t:'Signaturen einfügen',
s4_p:'<p>Im Sondenscanner im Spiel <kbd>Strg</kbd>+<kbd>A</kbd> und dann <kbd>Strg</kbd>+<kbd>C</kbd> drücken, in das Feld <b>Signatures</b> des Systems einfügen und auf <span class="k">Import</span> klicken. Mit <i>Remove signatures that are gone</i> werden alte entfernt.</p>',
s5_t:'Verbindungen eintragen',
s5_p:'<p>Klicke auf eine Verbindung, um den Wurmlochtyp (z. B. H296), die Masse und das Lebensende einzutragen. Masserechner und <b>Add a pass</b> verfolgen die Restmasse für die ganze Gruppe.</p>',
lg_stable:'Stabiles Wurmloch',lg_mass:'Masse reduziert',lg_crit:'Masse kritisch',lg_eol:'Lebensende (EOL)',lg_gate:'Stargate',
s6_t:'ENTER, EXIT und Home',
s6_p:'<p><b>Rechtsklick</b> auf ein System → <span class="k gold">Set as ENTER</span> markiert es als Eingang, <span class="k ok">Set as EXIT</span> als Weg nach Hause. Ein erneuter Rechtsklick entfernt die Markierung. <span class="k">Home</span> legt deine Basis fest, <span class="k">My location</span> springt zu dir.</p>',
s7_t:'Thera, Turnur und Handelszentren',
s7_p:'<p>Der Knopf <span class="k">🌀 Thera / Turnur</span> blendet die Hubs ein oder aus; sie erscheinen von selbst, wenn deine Kette mit ihnen verbunden ist. Im rechten Bereich:</p><ul><li><b>Thera / Turnur</b>: jeder Ausgang, sortiert nach Sprüngen von deinem System, ohne den anderen Hub; eine Abkürzung über den anderen Hub wird nur gezeigt, wenn sie kürzer ist.</li><li><b>Routes to trade hubs</b>: kürzeste, sicherste und kürzeste ohne beide Hubs.</li></ul>',
s8_t:'Route an EVE senden',
s8_p:'<p>Im Bereich eines Systems schickt <span class="k">Set destination</span> oder <span class="k">Add waypoint</span> die Route direkt an deinen EVE-Client (Wegpunkt-Berechtigung nötig).</p>',
s9_t:'3D-Ansicht und Assets',
s9_p:'<p><span class="k">3D view</span> dreht die Kette um das ausgewählte System: ziehen zum Drehen, <kbd>Umschalt</kbd>+ziehen zum Verschieben, Mausrad zum Zoomen.</p><p><span class="k">📦 Assets</span> markiert Systeme, in denen deine Charaktere Assets haben. Nach jedem Wurmlochsprung listet ein Fenster die in deiner gewählten Reichweite.</p>',
s10_t:'Mit der Gruppe teilen',
s10_p:'<p>Der Kartenbesitzer öffnet <span class="k">Access</span> und lädt andere Charaktere ein, mit Bearbeitungs- oder Leserechten: bis zu <b>10 Charaktere</b> pro Karte, Besitzer inklusive (mehr würde Hosting-Kosten für den Betreiber verursachen; mehr auf Anfrage, gegen Angebot). Sie loggen sich auf derselben Seite ein und landen automatisch auf deiner Karte. Niemand sonst sieht sie.</p>',s11_t:'Markt in der Nähe',s11_p:'<p>Öffne rechts <b>🛒 My market products</b>: durchsuche die Kategorien des EVE-Markts oder suche, und <b>klicke auf ein Produkt</b>, um es hinzuzufügen (✓). Ein zweiter Klick entfernt es. Die Liste hat kein Limit und bleibt in diesem Browser gespeichert.</p><p><b>Rechtsklick</b> auf ein K-Space-System deiner Kette (Highsec, Lowsec, Nullsec, Pochven) → <span class="k">🛒 Market nearby</span>. Wähle die Reichweite (nur dieses System bis 5 Sprünge) und klicke auf <span class="k">Search prices</span>. Pro Produkt: <b>Best sell</b> = günstigster Kaufpreis, <b>Best buy</b> = höchster Preis, zu dem du verkaufen kannst, mit System, Sprüngen und Menge („structure“ = Spieler-Zitadelle). Ein Klick auf einen Systemnamen setzt es als Ziel im Spiel.</p>',s12_t:'Aktivität (NPC-Kills)',s12_p:'<p><b>Rechtsklick</b> auf ein Lowsec- oder Nullsec-System → <span class="k">💰 Activity (NPC kills)</span>. Wähle die Reichweite (1 bis 5 Sprünge) und klicke auf <span class="k">Estimate</span>. Das Fenster listet die Lowsec- und Nullsec-Systeme in Reichweite, die aktivsten zuerst: Sprünge, <b>NPC/h</b> (in der letzten Stunde getötete NPCs, CCP-Daten; grün über 300, gelb über 100) und <b>≈ ISK/h</b>.</p><p>Der ISK-Wert ist nur eine <b>Schätzung</b> dessen, was das ESS des Systems pro Stunde sammelt: EVE veröffentlicht den ESS-Inhalt nicht. Lowsec und NPC-Nullsec haben kein ESS. Die Main Bank zahlt etwa alle 3 Stunden aus und kann also bis etwa das Dreifache des Stundenwerts enthalten. Ein Klick auf einen Systemnamen öffnet es auf DOTLAN.</p>',s13_t:'Gefahrenwarnungen',s13_p:'<p>Systeme deiner Kette mit Kills in der letzten Stunde werden auf der Karte markiert. Sobald ein System <b>einen Kill in den letzten 10 Minuten</b> hat, geht es in den Alarm. Klicke auf das System: sein Bereich listet die letzten Kills (Schiff, wie lange her), jeweils mit Link zu zKillboard.</p>',s14_t:'Die Seite unterstützen',s14_p:'<p>Anoikis Traveler ist kostenlos. Der Knopf <span class="k">❤️ Donate</span> (oben) und das grüne Feld rechts erklären, wie du helfen kannst: Namen <b>Sava Yesh</b> kopieren, Charakter in EVE suchen, Rechtsklick → <b>Give Money</b>. Jeder Betrag hilft, die Server am Laufen zu halten.</p>',
req_title:'Eigene Karte bekommen',req_lead:'Erstelle sie selbst mit einem Klick. Sie ist kostenlos.',
req_how:'So erstellst du sie',req_open:'Karte öffnen',
req_steps:'<li>Öffne die Karte und logge dich mit EVE mit dem Charakter ein, der die Karte deiner Gruppe <b>besitzen</b> soll (meist der Direktor deiner Corporation).</li><li>Klicke auf <b>Create my map</b>: Deine Karte öffnet sich sofort.</li><li>Lade deine Gruppe über <b>Access</b> ein: bis zu 10 Charaktere pro Karte, du eingeschlossen (mehr gegen Angebot).</li><li>Wenn sie deiner Gruppe hilft, hält eine ISK-Spende an <b>Sava Yesh</b> die Seite online.</li>',
req_what:'Gut zu wissen',req_what_p:'<p>Eine Karte pro Charakter. Der Charakter, der die Karte erstellt, besitzt sie und verwaltet ihre Mitglieder. Nichts zu installieren, keine Mail nötig.</p>',
copy_name:'Namen kopieren',copy_subject:'Betreff kopieren',copied:'Kopiert',
faq_title:'FAQ',
q1:'Was kostet es?',a1:'Nichts: Anoikis Traveler ist kostenlos und werbefrei. Jede Karte fasst bis zu 10 Charaktere: Mehr würde Hosting-Kosten für den Betreiber verursachen. Mehr nötig? Angebot per EVE-Mail an Sava Yesh anfragen. ISK-Spenden an Sava Yesh helfen, die Seite online zu halten.',
q2:'Ist mein Konto sicher?',a2:'Du meldest dich über die offizielle EVE-SSO-Seite von CCP an, die Karte sieht dein Passwort nie. Sie liest nur, was du erlaubst (Standort, Schiff, Assets), und kann nur Wegpunkte setzen. Den Zugriff kannst du jederzeit auf der EVE-Website unter Drittanbieter-Anwendungen widerrufen.',
q3:'Wer kann meine Karte sehen?',a3:'Nur der Besitzer und die Charaktere, die er einlädt. Jede Gruppenkarte ist privat.',
q4:'Muss ich etwas installieren?',a4:'Nein. Alles läuft im Browser, am besten auf dem Computer neben dem EVE-Client.',
q5:'Ist das von CCP erlaubt?',a5:'Die Karte nutzt die offizielle ESI-Schnittstelle von CCP, wie andere EVE-Tools von Drittanbietern. Es ist ein Fanprojekt, nicht mit CCP verbunden und nicht von CCP unterstützt.',
why_t:'Kostenlos, dank Spenden',why_p:'<p>Die Karte, die Markt- und Aktivitätswerkzeuge und das kommende Fitting-Tool sind <b>für alle kostenlos</b>. Server und Entwicklung bezahlt ein einzelner Spieler.</p><p>Wenn dir die Karte Zeit (oder deine Kapsel) spart, sende im Spiel ein paar ISK an <b>Sava Yesh</b>: Charakter suchen, Rechtsklick → <b>Give Money</b>. Jeder Betrag hilft. <a href="#support">So spendest du</a></p>',
q7:'Wie kann ich helfen?',a7:'Sende im Spiel ISK an Sava Yesh (Charakter suchen, Rechtsklick → Give Money), empfiehl die Karte anderen Wurmlochpiloten oder starte EVE mit unserem Werbelink, wenn du neu bist. Eine Spende gibt keinen zusätzlichen Zugang: Alle bekommen dieselbe Karte.',
q6:'Woher kommen die Thera- und Turnur-Daten?',a6:'Von EVE-Scout, betrieben von Signal Cartel, alle 5 Minuten aktualisiert.',
sup_title:'Projekt unterstützen',sup_lead:'Anoikis Traveler ist werbefrei. Wenn es dir gefällt, gibt es zwei Wege zu helfen.',
isk_t:'ISK senden',isk_p:'Suche in EVE den Charakter unten, Rechtsklick → <b>Give Money</b>. Jeder Betrag hilft, die Karte online zu halten.',isk_note:'Eine Spende gibt keinen zusätzlichen Zugang: Alle bekommen dieselbe Karte.',
raf_t:'Neu bei EVE? Mit unserem Link starten',raf_p:'Erstelle dein EVE-Online-Konto über unseren Freundschaftswerbungs-Link: Du erhältst den Willkommensbonus von CCP und unterstützt das Projekt.',raf_btn:'EVE-Konto erstellen',raf_note:'Offizielles „Recruit a Friend“-Programm von CCP. Die Belohnungen legt CCP fest.',
rights:'Alle Rechte vorbehalten.',ccp:'EVE Online sowie alle zugehörigen Namen und Bilder sind Eigentum von CCP hf. Dieses Tool ist weder mit CCP hf verbunden noch von CCP hf unterstützt.'
},

nav_features:'Funciones',nav_tutorial:'Tutorial',nav_request:'Tu mapa',nav_faq:'FAQ',nav_support:'Apoyar',
hero_tag:'Un mapa de agujeros de gusano compartido para EVE Online que sigue tu rastro por Anoikis.',
hero_sub:'Inicia sesión con EVE y vuela: cada salto se añade en directo al mapa de tu grupo. Conexiones de Thera y Turnur, rutas a los centros comerciales, mercados cercanos y vista 3D incluidos. Privado, sin instalar nada y gratis.',
btn_demo:'Probar la demo',btn_open:'Abrir el mapa',btn_request:'Pedir tu propio mapa',btn_support:'❤️ Apoyar el sitio',
alt_overview:'Anoikis Traveler mostrando una cadena de agujeros de gusano con pilotos, conexiones y el panel de Thera',
feat_langs:'🌐 Esta guía: English · Français · Deutsch · Español. El mapa está en inglés por ahora.',soon_t:'🚧 Próximamente',soon_p:'Otras herramientas están en preparación y pronto estarán disponibles aquí:',soon_1:'<b>Herramienta de fitting</b>: preparar y comprobar tus fits fuera del juego, con tus habilidades, los precios y el envío de los fits a EVE.',soon_2:'<b>Rutas comerciales</b>: encontrar buenas ofertas para comprar aquí y vender allá, entre mercados.',soon_3:'Y más por venir, según lo que pidan los pilotos.',feat_title:'Funciones',feat_lead:'Todo lo que un grupo de agujeros de gusano necesita para explorar, cerrar agujeros y volver a casa, en una sola pantalla.',
f1_t:'Seguimiento automático',f1_p:'El mapa sigue a tu personaje: cada sistema al que saltas se añade con su conexión, en directo.',
f2_t:'Compartido con tu grupo',f2_p:'Todos ven la misma cadena y dónde está cada piloto. Verde: mapa abierto; insignia EVE: en el juego.',
f3_t:'Detalle de conexiones',f3_p:'Tipo de agujero, estado de masa, fin de vida, calculadora de masa y registro de pasos compartido con todo el grupo.',
f4_t:'Thera y Turnur',f4_p:'Datos de EVE-Scout en directo. Los hubs se quedan aparte y solo se unen a tu cadena cuando estás conectado a ellos.',
f5_t:'Rutas a centros comerciales',f5_p:'Jita, Amarr, Dodixie, Rens y Hek: la ruta más corta, la más segura y la más corta sin pasar por Thera ni Turnur.',
f6_t:'Alertas de peligro',f6_p:'Las muertes recientes se marcan en el mapa, con alarma en cuanto un sistema tiene una muerte en los últimos 10 minutos.',
f7_t:'Vista 3D',f7_p:'Gira la cadena en 3D alrededor del sistema seleccionado para leer cadenas grandes de un vistazo.',
f8_t:'Activos y destino',f8_p:'Mira dónde tienen activos tus personajes, recibe un aviso tras cada salto y envía una ruta directamente a tu cliente de EVE.',new_b:'Nuevo',f9_t:'Mercado cercano',f9_p:'Clic derecho en un sistema de espacio conocido de tu cadena → Market nearby: mejores precios de compra y venta a 0–5 saltos para tu propia lista de productos, elegida en todo el mercado de EVE. Un clic en un sistema lo fija como destino en el juego.',f10_t:'Actividad (NPC muertos)',f10_p:'¿Tu agujero sale a lowsec o nullsec? Clic derecho en el sistema → Activity (NPC kills), elige un alcance en saltos y mira los sistemas lowsec y nullsec cercanos con sus NPC muertos en la última hora y una estimación de lo que acumula su ESS (solo nullsec). Solo una estimación: EVE no publica el contenido de los ESS.',
shots_title:'Capturas',shots_lead:'Tomadas de la demo, que puedes probar sin iniciar sesión.',
cap_system:'Un sistema seleccionado con sus detalles',cap_system_html:'<b>Detalle del sistema.</b> Haz clic en un sistema: clase, región, muertes recientes, notas compartidas, firmas y la ruta desde ti.',
cap_thera:'Thera conectada a la cadena',cap_thera_html:'<b>Thera y Turnur.</b> Cada salida con su tamaño, el tiempo que le queda y los saltos desde tu sistema actual.',
cap_3d:'La vista 3D',cap_3d_html:'<b>Vista 3D.</b> La cadena gira alrededor del sistema seleccionado; las salidas de los hubs se reparten en altura.',
cap_chain:'Una cadena de agujeros de gusano',cap_chain_html:'<b>La cadena.</b> Los colores indican la clase del sistema y el estilo de las líneas el estado de cada conexión.',
tut_title:'Tutorial',tut_lead:'Catorce pasos, desde el primer inicio de sesión hasta los mercados y la actividad en nullsec. Puedes practicar casi todo antes en la demo.',
s1_t:'Iniciar sesión con EVE',
s1_p:'<p>Haz clic en <span class="k">EVE login</span>. Inicias sesión en la página oficial de CCP: el mapa nunca ve tu contraseña.</p><p>Acepta los permisos: <b>ubicación, estado en línea y nave</b> sirven para seguirte. <b>Puntos de ruta, activos y estructuras</b> son opcionales y activan las funciones correspondientes.</p>',
s2_t:'Vuela: tu rastro se dibuja solo',
s2_p:'<p>Cada salto añade el nuevo sistema y la conexión usada. Tu sistema aparece marcado <b>▼ You</b> y tus compañeros aparecen en sus sistemas.</p><p>El panel <b>Pilots</b> muestra a todos: punto verde = mapa abierto, insignia <span class="k ok">EVE</span> = en el juego.</p>',
s3_t:'Leer un sistema',
s3_p:'<p>Haz clic en un sistema para ver su clase, estáticos, efecto, muertes de la última hora, la ruta desde ti y las notas compartidas del grupo (residentes, estructuras, peligros).</p><p>Para moverte: arrastra un sistema para colocarlo, rueda para hacer zoom, arrastra el fondo para desplazarte. <span class="k">Recenter</span> vuelve al sistema seleccionado.</p>',
s4_t:'Pegar tus firmas',
s4_p:'<p>En el escáner de sondas del juego pulsa <kbd>Ctrl</kbd>+<kbd>A</kbd> y luego <kbd>Ctrl</kbd>+<kbd>C</kbd>, pega en la casilla <b>Signatures</b> del sistema y haz clic en <span class="k">Import</span>. Marca <i>Remove signatures that are gone</i> para borrar las antiguas.</p>',
s5_t:'Anotar las conexiones',
s5_p:'<p>Haz clic en una conexión para indicar el tipo de agujero (p. ej. H296), su masa y su fin de vida. La calculadora de masa y <b>Add a pass</b> siguen la masa restante para todo el grupo.</p>',
lg_stable:'Agujero estable',lg_mass:'Masa reducida',lg_crit:'Masa crítica',lg_eol:'Fin de vida (EOL)',lg_gate:'Puerta estelar',
s6_t:'ENTER, EXIT y Home',
s6_p:'<p><b>Clic derecho</b> en un sistema → <span class="k gold">Set as ENTER</span> lo marca como la entrada y <span class="k ok">Set as EXIT</span> como el camino a casa. Otro clic derecho quita la marca. <span class="k">Home</span> define tu base y <span class="k">My location</span> lleva la vista hasta ti.</p>',
s7_t:'Thera, Turnur y centros comerciales',
s7_p:'<p>El botón <span class="k">🌀 Thera / Turnur</span> muestra u oculta los hubs; aparecen solos cuando tu cadena se conecta a ellos. En el panel derecho:</p><ul><li><b>Thera / Turnur</b>: cada salida, ordenada por saltos desde tu sistema, sin pasar por el otro hub; un atajo por el otro hub solo aparece si es más corto.</li><li><b>Routes to trade hubs</b>: la más corta, la más segura y la más corta evitando ambos hubs.</li></ul>',
s8_t:'Enviar una ruta a EVE',
s8_p:'<p>En el panel de un sistema, <span class="k">Set destination</span> o <span class="k">Add waypoint</span> envía la ruta directamente a tu cliente de EVE (requiere el permiso de puntos de ruta).</p>',
s9_t:'Vista 3D y activos',
s9_p:'<p><span class="k">3D view</span> gira la cadena alrededor del sistema seleccionado: arrastra para girar, <kbd>Mayús</kbd>+arrastrar para desplazar, rueda para hacer zoom.</p><p><span class="k">📦 Assets</span> marca los sistemas donde tus personajes tienen activos. Tras cada salto de agujero de gusano, una ventana lista los que están dentro del alcance que elijas.</p>',
s10_t:'Compartir con tu grupo',
s10_p:'<p>El propietario del mapa abre <span class="k">Access</span> e invita a otros personajes, con permiso de edición o solo lectura: hasta <b>10 personajes</b> por mapa, propietario incluido (más supondría costes de alojamiento para el dueño del sitio; más es posible bajo presupuesto). Inician sesión en la misma página y llegan directamente a tu mapa. Nadie más puede verlo.</p>',s11_t:'Mercado cercano',s11_p:'<p>En el panel derecho, abre <b>🛒 My market products</b>: recorre las categorías del mercado de EVE o busca, y <b>haz clic en un producto</b> para añadirlo (✓). Un segundo clic lo quita. La lista no tiene límite y queda guardada en este navegador.</p><p><b>Clic derecho</b> en un sistema de espacio conocido de tu cadena (highsec, lowsec, nullsec, Pochven) → <span class="k">🛒 Market nearby</span>. Elige el alcance (solo este sistema, hasta 5 saltos) y haz clic en <span class="k">Search prices</span>. Para cada producto: <b>Best sell</b> = el precio más bajo para comprar, <b>Best buy</b> = el precio más alto al que puedes vender, con el sistema, los saltos y la cantidad («structure» = ciudadela de jugadores). Un clic en el nombre de un sistema lo fija como destino en el juego.</p>',s12_t:'Actividad (NPC muertos)',s12_p:'<p><b>Clic derecho</b> en un sistema lowsec o nullsec → <span class="k">💰 Activity (NPC kills)</span>. Elige el alcance (1 a 5 saltos) y haz clic en <span class="k">Estimate</span>. La ventana lista los sistemas lowsec y nullsec al alcance, los más activos primero: saltos, <b>NPC/h</b> (NPC muertos en la última hora, datos de CCP; verde por encima de 300, amarillo por encima de 100) y <b>≈ ISK/h</b>.</p><p>La cifra en ISK es solo una <b>estimación</b> de lo que acumula el ESS del sistema por hora: EVE no publica el contenido de los ESS. Lowsec y el nullsec de NPC no tienen ESS. El Main Bank paga cada 3 horas aproximadamente, así que puede contener hasta unas 3 veces la cifra por hora. Un clic en el nombre de un sistema lo abre en DOTLAN.</p>',s13_t:'Alertas de peligro',s13_p:'<p>Los sistemas de tu cadena con muertes en la última hora se marcan en el mapa. En cuanto un sistema tiene <b>una muerte en los últimos 10 minutos</b>, pasa a alarma. Haz clic en el sistema: su panel lista las últimas muertes (nave, hace cuánto), cada una enlazada a zKillboard.</p>',s14_t:'Apoyar el sitio',s14_p:'<p>Anoikis Traveler es gratis. El botón <span class="k">❤️ Donate</span> (barra superior) y el recuadro verde del panel derecho explican cómo ayudar: copia el nombre <b>Sava Yesh</b>, busca el personaje en EVE, clic derecho → <b>Give Money</b>. Cualquier cantidad ayuda a mantener los servidores.</p>',
req_title:'Tener tu propio mapa',req_lead:'Créalo tú mismo con un clic. Es gratis.',
req_how:'Cómo crearlo',req_open:'Abrir el mapa',
req_steps:'<li>Abre el mapa e inicia sesión con EVE con el personaje que será el <b>propietario</b> del mapa de tu grupo (normalmente el director de tu corporación).</li><li>Haz clic en <b>Create my map</b>: tu mapa se abre al instante.</li><li>Invita a tu grupo desde <b>Access</b>: hasta 10 personajes por mapa, tú incluido (más bajo presupuesto).</li><li>Si le sirve a tu grupo, una donación en ISK a <b>Sava Yesh</b> ayuda a mantener el sitio en línea.</li>',
req_what:'Conviene saber',req_what_p:'<p>Un mapa por personaje. El personaje que crea el mapa es su propietario y gestiona sus miembros. Nada que instalar, ningún correo que enviar.</p>',

faq_title:'Preguntas frecuentes',
q1:'¿Cuánto cuesta?',a1:'Nada: Anoikis Traveler es gratis y sin anuncios. Cada mapa admite hasta 10 personajes: más supondría costes de alojamiento para el dueño del sitio. ¿Necesitas más? Pide un presupuesto por EVE mail a Sava Yesh. Las donaciones en ISK a Sava Yesh ayudan a mantenerlo en línea.',
q2:'¿Mi cuenta está segura?',a2:'Inicias sesión en la página oficial EVE SSO de CCP, así que el mapa nunca ve tu contraseña. Solo lee lo que permitas (ubicación, nave, activos) y solo puede escribir puntos de ruta. Puedes revocar el acceso en cualquier momento en la web de EVE, en aplicaciones de terceros.',
q3:'¿Quién puede ver mi mapa?',a3:'Solo el propietario y los personajes que invite. El mapa de cada grupo es privado.',
q4:'¿Tengo que instalar algo?',a4:'No. Funciona en el navegador, mejor en un ordenador junto al cliente de EVE.',
q5:'¿Lo permite CCP?',a5:'Usa la interfaz oficial ESI de CCP, como otras herramientas de terceros para EVE. Es un proyecto de fans, sin relación con CCP ni respaldado por CCP.',
why_t:'Gratis, gracias a las donaciones',why_p:'<p>El mapa, las herramientas de mercado y de actividad, y la herramienta de fitting que llegará son <b>gratis para todos</b>. Los servidores y el desarrollo los paga un solo jugador.</p><p>Si el mapa te ahorra tiempo (o tu cápsula), envía unos ISK en el juego a <b>Sava Yesh</b>: busca el personaje, clic derecho → <b>Give Money</b>. Cualquier cantidad ayuda. <a href="#support">Cómo donar</a></p>',
q7:'¿Cómo puedo ayudar?',a7:'Envía ISK en el juego a Sava Yesh (busca el personaje, clic derecho → Give Money), recomienda el mapa a otros pilotos de agujeros de gusano o empieza en EVE con nuestro enlace si eres nuevo. Donar no da acceso extra: todos tienen el mismo mapa.',
q6:'¿De dónde salen los datos de Thera y Turnur?',a6:'De EVE-Scout, gestionado por Signal Cartel, actualizado cada 5 minutos.',

const LANGS = Object.keys(T);
const $ = s => document.querySelector(s);
function pick(){
  const q = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(q)) return q;
  try{ const s = localStorage.getItem('at.lang'); if (LANGS.includes(s)) return s; }catch(e){}
  for (const l of navigator.languages || [navigator.language || 'en']){ const c = String(l).slice(0, 2).toLowerCase(); if (LANGS.includes(c)) return c; }
  return 'en';
}
let lang = pick();
function apply(l){
  lang = l; const d = T[l];
  document.documentElement.lang = l;
  // a language may be incomplete: missing texts fall back to English, so translations can be added a little at a time
  document.querySelectorAll('[data-i18n]').forEach(e => { const v = d[e.dataset.i18n] ?? T.en[e.dataset.i18n]; if (v != null) e.innerHTML = v; });
  document.querySelectorAll('[data-i18n-alt]').forEach(e => { e.alt = d[e.dataset.i18nAlt] ?? T.en[e.dataset.i18nAlt] ?? ''; });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === l));
  $('#rafLink').href = `https://www.eveonline.com/${l === 'en' ? '' : l + '/'}signup?invc=${RAF}`;
  try{ localStorage.setItem('at.lang', l); }catch(e){}
  const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null, '', u);
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => apply(b.dataset.lang)));
document.addEventListener('click', async e => {
  const c = e.target.closest('[data-copy]'); if (!c) return;
  try{ await navigator.clipboard.writeText(c.dataset.copy); }catch(x){}
  const t = $('#toast'); t.textContent = `${T[lang].copied}: ${c.dataset.copy}`; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1600);
});
document.querySelectorAll('figure img, .shot img').forEach(i => i.addEventListener('click', () => { $('#lb img').src = i.src; $('#lb img').alt = i.alt; $('#lb').classList.add('on'); }));
$('#lb').addEventListener('click', () => $('#lb').classList.remove('on'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#lb').classList.remove('on'); });
apply(lang);
/* Private visit counter: one count per browser per day, sent to the owner's server. Nothing is shown here. */
(async () => {
  try{
    const q = new URLSearchParams(location.search);
    if (q.has('nocount')) localStorage.setItem('at.nocount', '1');
    if (localStorage.getItem('at.nocount') === '1') return;
    const today = new Date().toISOString().slice(0, 10);
    if (localStorage.getItem('at.counted') === today) return;
    const isNew = !localStorage.getItem('at.counted');
    const cfg = await (await fetch('../dons/config.json', { cache:'no-store' })).json();
    if (!cfg.worker) return;
    const body = JSON.stringify({ lang, isNew });
    const sent = navigator.sendBeacon && navigator.sendBeacon(cfg.worker.replace(/\/+$/, '') + '/hit', new Blob([body], { type:'text/plain' }));
    if (!sent) fetch(cfg.worker.replace(/\/+$/, '') + '/hit', { method:'POST', body, headers:{ 'Content-Type':'text/plain' }, keepalive:true, mode:'cors' }).catch(() => {});
    localStorage.setItem('at.counted', today);
  }catch(e){}
})();
</script>
