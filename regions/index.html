<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anoikis Traveler · Region map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Region map: real EVE coordinates in 3D, live position from the mapper's EVE login, wormholes from the mapper. */
:root{
  --bg:#070a12; --panel:#0e1424; --panel-2:#141c30; --line:#24314c; --text:#e2e8f3; --dim:#8b98b0;
  --accent:#f2a74b; --ok:#5fd68a; --warn:#f2c94b; --bad:#ef5a5a; --eol:#c07cff; --wh:#8fb0d8; --ap:#4fd2ff;
  --display:"Saira Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel-2);border:1px solid var(--line);padding:5px 10px;border-radius:3px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:#1a1205;border-color:var(--accent);font-weight:600}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
input,select{background:var(--bg);border:1px solid var(--line);padding:5px 8px;border-radius:3px;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
a{color:var(--accent)}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-family:var(--display);font-size:1.45rem;margin:0 6px 0 0;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
header h1 a{color:inherit;text-decoration:none}
header h1 small{color:var(--accent)}
header .grow{flex:1}
#who{font-size:13px;white-space:nowrap}
#whSel{max-width:230px;border-color:var(--eol)}
#whSel option.r{font-weight:600}
#who b{color:var(--accent)}
main{display:grid;grid-template-columns:1fr 330px;min-height:0}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none}
#map{width:100%;height:100%;display:block;cursor:grab;user-select:none}
#map.dragging{cursor:grabbing}
#hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--dim);pointer-events:none}
#banner{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--eol);color:var(--text);padding:7px 14px;border-radius:4px;font-size:13px;display:none;z-index:3}
#banner.on{display:block}
#zoomBtns{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
#zoomBtns button{width:34px;height:34px;padding:0;font-size:18px}
#panel h2{font-family:var(--display);font-size:1.6rem;letter-spacing:.04em;margin:0 0 2px}
#panel h3{font-family:var(--display);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:16px 0 6px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:10px;font-size:12px;margin:0 4px 4px 0}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:3px 0;border-bottom:1px solid rgba(36,49,76,.5);font-size:13px}
.lk{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline dotted}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);padding:8px 14px;border-radius:4px;display:none;z-index:9}
#toast.err{border-color:var(--bad)}
.legend span{display:inline-flex;align-items:center;gap:5px;margin:0 10px 4px 0;font-size:12px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid}
/* SVG */
.drop{stroke:#2a3552;stroke-width:1;opacity:.55}
.drop.one{stroke:#55688f;opacity:.9;stroke-dasharray:3 3}
.ground{fill:#3a4766}
.gate{stroke:#3c4a66;stroke-width:1.6}
.gate.xc{stroke:#55688f}
.gate.xr{stroke:var(--accent);stroke-dasharray:5 4;opacity:.8}
.gate.route,.whl.route{stroke:var(--ok)!important;stroke-width:3.5;opacity:1;stroke-dasharray:none}
.whl{fill:none;stroke-width:2.6;stroke:var(--wh)}
.whl.reduced{stroke:var(--warn);stroke-dasharray:10 5}
.whl.critical{stroke:var(--bad);stroke-dasharray:4 4}
.whl.eol{stroke:var(--eol)}
.whl.dying{animation:whdie 1.1s ease-in-out infinite}
@keyframes whdie{0%,100%{opacity:1}50%{opacity:.08}}
.sys{cursor:pointer}
.sys .dot{stroke:rgba(0,0,0,.6);stroke-width:1}
.sys:hover .dot{stroke:#fff;stroke-width:1.5}
.sys.ext .dot{opacity:.5}
.sys .halo{fill:none;stroke:var(--accent);stroke-width:2}
.sys .inmap{fill:none;stroke:var(--wh);stroke-width:1.4;stroke-dasharray:2 2}
.lbl{font-family:var(--body);font-size:11px;fill:#c3cde0;paint-order:stroke;stroke:#070a12;stroke-width:3px;pointer-events:none}
.lbl.ext{fill:#8b98b0;font-style:italic}
.lbl.sel{fill:var(--accent);font-weight:600;font-size:13px}
.clbl{font-family:var(--display);font-size:15px;letter-spacing:.12em;fill:#55688f;opacity:.75;pointer-events:none;text-transform:uppercase}
.me{fill:none;stroke:var(--ok);stroke-width:2.5}
.mepulse{fill:none;stroke:var(--ok);stroke-width:2;animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
.asset{fill:#d9a23f;stroke:#070a12;stroke-width:1}
.assetl{stroke:#7a5414;stroke-width:1.2;fill:none}
.assetn{font-family:var(--mono);font-size:10px;fill:#f2c46b;paint-order:stroke;stroke:#070a12;stroke-width:3px;pointer-events:none}
.pil{font-family:var(--mono);font-size:10.5px;fill:var(--ok);paint-order:stroke;stroke:#070a12;stroke-width:3px;pointer-events:none}
.hublbl{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;paint-order:stroke;stroke:#070a12;stroke-width:4px;pointer-events:none}
.jcard{fill:rgba(10,14,26,.88);stroke-width:1;stroke-opacity:.5}
.jhead{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;fill:#8b98b0}
.jline{font-family:var(--mono);font-size:11px;white-space:pre}
.jline.on{font-weight:600}
.jline.sub{fill:#9aa6bd;font-size:10.5px}
.jrow{cursor:pointer}
.jrow:hover .jline{text-decoration:underline}
.jlbl{font-family:var(--mono);font-size:10px;paint-order:stroke;stroke:#070a12;stroke-width:3px;pointer-events:none;opacity:.8}
.jlbl.on{font-size:11.5px;font-weight:500;opacity:1}
.jmini{font-family:var(--mono);font-size:9.5px;fill:#aab6cc;paint-order:stroke;stroke:#070a12;stroke-width:3px;pointer-events:none}
.jnode{cursor:pointer}
.hubsub{font-family:var(--mono);font-size:10.5px;fill:#c3cde0;paint-order:stroke;stroke:#070a12;stroke-width:3px;pointer-events:none}
.netlist li{display:grid;grid-template-columns:34px 1fr;column-gap:6px;align-items:baseline;cursor:pointer}
.netlist li > .dim{grid-column:2}
.netlist li:hover .nm{color:var(--accent)}
.netlist .sc{font-family:var(--mono);font-size:12px}
.stub{font-family:var(--mono);font-size:10.5px;fill:#cdb8ff;paint-order:stroke;stroke:#070a12;stroke-width:3px;cursor:pointer}
/* Autopilot route widget */
#apBox{border-left:3px solid var(--ap)}
#apBox[hidden]{display:none}
#apHead{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:none;border-radius:0;padding:8px 10px;font-size:13px}
#apHead .car{display:inline-block;transition:transform .15s;color:var(--dim)}
#apHead[aria-expanded="false"] .car{transform:rotate(-90deg)}
#apHead b{font-family:var(--display);font-size:1.05rem;letter-spacing:.04em}
#apHead .nx{display:block;font-size:12px;color:var(--dim);font-weight:400}
#apBody{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line)}
#apBody[hidden]{display:none}
#apBody.wb{padding:0}
.aptools{display:flex;gap:6px;align-items:center;padding:6px 10px}
.aptools select{flex:1;font-size:12px;padding:3px 5px}
.aptools button{font-size:12px;padding:3px 8px}
#apList{list-style:none;margin:0;padding:2px 0 6px;overflow:auto;min-height:0;counter-reset:ap -1}
#apList li{display:grid;grid-template-columns:22px 34px 1fr;align-items:baseline;gap:4px;padding:2px 10px;font-size:13px;cursor:pointer;counter-increment:ap}
#apList li::before{content:counter(ap);color:var(--dim);font-family:var(--mono);font-size:11px;text-align:right}
#apList li:hover{background:var(--panel-2)}
#apList li .sc{font-family:var(--mono);font-size:12px}
#apList li .rg{display:block;font-size:11px;color:var(--dim)}
#apList li .via{font-size:11px;color:var(--eol)}
#apList li.here{background:rgba(95,214,138,.12)}
#apList li.here .nm{color:var(--ok);font-weight:600}
#apList li.here::before{content:"▶";color:var(--ok)}
#apList li.wp .nm{color:var(--ap);font-weight:600}
#apList li.dest .nm{color:var(--accent);font-weight:700}
#apList li.reg{border-top:1px dashed var(--line);margin-top:3px;padding-top:4px}
#apMsg{padding:4px 10px 8px;font-size:12px;color:var(--dim)}
.gate.ap,.whl.ap{stroke:var(--ap)!important;stroke-width:3;opacity:1;stroke-dasharray:none}
.sys .apdot{fill:none;stroke:var(--ap);stroke-width:1.5}
/* Thera / Turnur label: collapsible card with every connection */
#hubCards{position:absolute;inset:0;pointer-events:none;z-index:3}
.hubcard{position:absolute;pointer-events:auto;width:310px;background:rgba(10,14,26,.93);border:1px solid;border-radius:5px;box-shadow:0 6px 22px rgba(0,0,0,.45);font-size:12.5px;display:flex;flex-direction:column}
.hubcard .hc-head{display:flex;align-items:baseline;gap:7px;width:100%;background:none;border:none;border-radius:0;padding:7px 10px;text-align:left}
.hubcard .hc-head b{font-family:var(--display);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase}
.hubcard .hc-head .car{color:var(--dim);display:inline-block;transition:transform .15s}
.hubcard .hc-head[aria-expanded="false"] .car{transform:rotate(-90deg)}
.hubcard .hc-head .cnt{color:var(--dim);font-size:12px;margin-left:auto}
.hubcard .hc-body{overflow:auto;border-top:1px solid var(--line);padding:2px 0 6px}
.hubcard .hc-sec{font-family:var(--display);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:7px 10px 2px}
.hubcard .hc-row{display:grid;grid-template-columns:12px 1fr auto;gap:7px;align-items:center;padding:3px 6px 3px 10px;cursor:pointer}
.hubcard .hc-row:hover{background:var(--panel-2)}
.hubcard .hc-row i{width:9px;height:9px;border-radius:50%;display:block}
.hubcard .hc-row .hc-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hubcard .hc-row .hc-n small{color:var(--dim);font-family:var(--mono);font-size:10.5px;margin-left:5px}
.hubcard .hc-row.on .hc-n{font-weight:600}
.hubcard .hc-row.on i{box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.hubcard .hc-wp{padding:1px 7px;font-size:12px;line-height:1.4}
.hubcard .hc-chain{padding:0 10px 3px 29px;font-family:var(--mono);font-size:10.5px;color:#9aa6bd}
/* ---------- Widgets: draggable, foldable windows over the full-screen map ---------- */
.widget{position:absolute;z-index:5;background:rgba(12,17,30,.92);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.5);backdrop-filter:blur(6px);display:flex;flex-direction:column;max-height:calc(100vh - 24px);min-width:200px}
.widget[hidden]{display:none}
.widget .wh{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 11px;cursor:grab;user-select:none;border-bottom:1px solid var(--line);touch-action:none}
.widget.dragging .wh{cursor:grabbing}
.widget .wt{font-family:var(--display);font-size:1.02rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.widget .wsub{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.widget .wcol{margin-left:auto;padding:0 8px;line-height:1.3;background:none;border-color:transparent;color:var(--dim)}
.widget .wcol:hover{border-color:var(--line)}
.widget .wb{padding:10px 11px;overflow:auto;min-height:0}
.widget.folded .wb,.widget.folded #apHead{display:none}
.widget.folded .wh{border-bottom:none}
.brand{font-family:var(--display);font-size:1.2rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text);text-decoration:none}
.brand b{color:var(--accent)}
.wnav{display:flex;gap:2px;margin-left:6px}
.wnav a{font-size:12px;color:var(--dim);text-decoration:none;padding:2px 7px;border-radius:3px}
.wnav a:hover{color:var(--text);background:var(--panel-2)}
.wb.tool{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wb.tool select,.wb.tool input{max-width:220px}
.wb.view{display:flex;flex-direction:column;gap:8px}
.wb.view .btns{display:flex;gap:5px;flex-wrap:wrap}
.wb.view button{font-size:12.5px;padding:4px 9px}
#wInfo{width:330px}
#wAssets{width:380px}
#wAssets .wb{max-height:min(560px,calc(100vh - 120px))}
#wAssets .wcol + .wcol{margin-left:0}
.as-char{font-family:var(--display);font-size:1.02rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:10px 0 4px}
.as-char:first-child{margin-top:0}
.as-loc{font-size:12px;color:var(--dim);margin:8px 0 3px;border-bottom:1px solid var(--line);padding-bottom:2px}
.as-list{list-style:none;margin:0;padding:0}
.as-list .as-list{padding-left:16px;border-left:1px dashed var(--line);margin-left:7px}
.as-it{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:2px 0;font-size:12.5px}
.as-it img{width:20px;height:20px;border-radius:2px;background:var(--bg)}
.as-it .q{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.as-it.box{cursor:pointer}
.as-it.box .nm::before{content:"▸ ";color:var(--dim)}
.as-it.box.open .nm::before{content:"▾ "}
.as-tools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.asset-hit{cursor:pointer}
#wChain{width:460px}
.chainwb{display:flex;flex-direction:column;gap:6px;resize:both;overflow:hidden;width:460px;height:340px;min-width:280px;min-height:200px;max-width:calc(100vw - 30px);max-height:calc(100vh - 80px)}
#wChain{width:auto}
.chaintools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.chaintools select{max-width:230px;font-size:12.5px;padding:3px 6px}
.chaintools input{width:52px;padding:2px 5px}
#chainSvg{flex:1;min-height:0;width:100%;background:rgba(5,8,16,.6);border:1px solid var(--line);border-radius:4px;cursor:grab;touch-action:none}
.chainnote{font-size:11.5px}
.cn{cursor:pointer}
.cn text{font-family:var(--mono);font-size:10.5px;fill:#d5dcea;paint-order:stroke;stroke:#05080f;stroke-width:3px;pointer-events:none}
.cn text.cls{font-size:9.5px;fill:#8b98b0}
.cn:hover circle.b{stroke:#fff;stroke-width:2}
.ce{stroke-width:2.2;fill:none}
.ce.reduced{stroke-dasharray:8 4}.ce.critical{stroke-dasharray:3 3}
.ce.gate{stroke:#3c4a66}
.ce.k{stroke:#8b98b0;stroke-dasharray:2 5;stroke-width:1.6}
.cek{font-family:var(--mono);font-size:10px;fill:#8b98b0;paint-order:stroke;stroke:#05080f;stroke-width:3px}
#wChars{width:300px}
#apBox{width:270px}
.chr{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid rgba(36,49,76,.6);cursor:pointer;border-radius:4px}
.chr:hover{background:var(--panel-2)}
.chr.on{background:rgba(242,167,75,.08);box-shadow:inset 2px 0 0 var(--accent)}
.chr img{width:34px;height:34px;border-radius:4px;background:var(--bg)}
.chr .nm{font-weight:600}
.chr .loc{font-size:12px;color:var(--dim)}
.chr .loc b{color:var(--text);font-weight:500}
.chr .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#55606f;margin-right:5px;vertical-align:1px}
.chr .dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.chr .x{background:none;border:none;color:var(--dim);padding:2px 6px}
.chr .x:hover{color:var(--bad)}
.chars-act{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.chars-act label{font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center}
.demo-tag{display:inline-block;font-size:10.5px;font-family:var(--mono);color:#1a1205;background:var(--accent);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:2px}
@media (max-width:820px){ #wInfo,#wChars{width:min(330px,calc(100vw - 24px))} }
</style>
</head>
<body>
<div id="stage">
  <svg id="map" aria-label="3D region map"></svg>
  <div id="banner"></div>
  <div id="hubCards"></div>
  <div id="hint">Drag to rotate · Shift+drag or right-drag to pan · Wheel to zoom · Click a system: rotation and zoom then turn around it</div>
  <div id="zoomBtns"><button id="zIn" type="button" aria-label="Zoom in">+</button><button id="zOut" type="button" aria-label="Zoom out">−</button></div>

  <section class="widget" id="wTool" data-title="Anoikis Traveler">
    <header class="wh"><span class="wt"><a href="../" class="brand">Anoikis <b>Traveler</b></a></span><nav class="wnav"><a href="../appraisal/">Appraisal</a><a href="../fitting/">Fitting</a><a href="../guide/">Guide</a></nav><button class="wcol" type="button" aria-label="Fold">–</button></header>
    <div class="wb tool">
      <select id="regSel" aria-label="Region"></select>
      <select id="whSel" aria-label="Regions with an active wormhole connection" title="Regions with an active wormhole connection"></select>
      <input id="search" list="sysList" placeholder="Find a system…" aria-label="Find a system">
      <datalist id="sysList"></datalist>
    </div>
  </section>

  <section class="widget" id="wView" data-title="View">
    <header class="wh"><span class="wt">View</span><button class="wcol" type="button" aria-label="Fold">–</button></header>
    <div class="wb view">
      <label class="dim">Colour <select id="colorSel" aria-label="Colour systems by"><option value="wh">Grey + wormholes</option><option value="sec">Security</option><option value="const">Constellation</option></select></label>
      <div class="btns">
        <button id="btnFollow" type="button" aria-pressed="true" title="Switch region and recenter automatically when your character jumps">Follow me</button>
        <button id="btnTop" type="button" title="Top-down view, like the in-game map">Top view</button>
        <button id="btnDrops" type="button" aria-pressed="false" title="Vertical lines from every system to the region's mid plane">Height lines</button>
        <button id="btnChain" type="button" aria-pressed="false" title="Flat map of your chains">Chain</button>
        <button id="btnAssets" type="button" aria-pressed="false" title="Mark the systems where your characters have assets">Assets</button>
        <button id="btnReset" type="button">Recenter</button>
        <button id="btnLayout" type="button" title="Put every window back in its place">Reset windows</button>
      </div>
    </div>
  </section>

  <section class="widget" id="wChars" data-title="Characters">
    <header class="wh"><span class="wt">Characters</span><span id="who" class="dim wsub"></span><button class="wcol" type="button" aria-label="Fold">–</button></header>
    <div class="wb" id="charsBody"></div>
  </section>

  <section class="widget" id="wInfo" data-title="Info">
    <header class="wh"><span class="wt" id="infoTitle">Region</span><button class="wcol" type="button" aria-label="Fold">–</button></header>
    <div class="wb"><div id="panel" aria-live="polite"></div></div>
  </section>

  <section class="widget" id="wChain" data-title="Chain" hidden>
    <header class="wh"><span class="wt">Chain</span><span class="wsub dim" id="chainSub"></span><button class="wcol" type="button" aria-label="Fold">–</button></header>
    <div class="wb chainwb">
      <div class="chaintools">
        <select id="chainSel" aria-label="Chain"></select>
        <label title="Two groups of systems linked by wormholes are the same chain when their known-space systems are this many gate jumps apart or less">Same chain within <input id="chainX" type="number" min="0" max="40" step="1"> jumps</label>
      </div>
      <svg id="chainSvg" aria-label="Flat map of the chain"></svg>
      <div class="dim chainnote" id="chainNote"></div>
    </div>
  </section>

  <section class="widget" id="wAssets" data-title="Assets" hidden>

<div id="toast" role="status"></div>
<script>
(() => {
'use strict';
const ESI = 'https://esi.evetech.net/latest';
const SSO = 'https://login.eveonline.com/v2/oauth';
const WP_SCOPE = 'esi-ui.write_waypoint.v1';
const MAPPER = '../map/';
const DATA = 'data/';
const svgNS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const sess = { get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ sessionStorage.setItem(k, v); }catch(e){} } };
// Same keys as the mapper (same site, same browser storage): login, map cache and pilots are shared with it.
const CK = { tok:'whmap.tok.', me:'whmap.me.', slot:'whmap.slot.' };
function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', err ? 6000 : 2800); }
function el(tag, attrs, parent){ const e = document.createElementNS(svgNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

/* ---------- Security & constellation colours ---------- */
const SEC_COL = ['#f00000','#d73000','#f04800','#f06000','#d77700','#efef00','#8fef2f','#00f000','#00ef47','#48f0c0','#2fefef'];
const secR = s => (s > 0 && s < 0.05) ? 0.1 : Math.round(s * 10) / 10;
const secCol = s => { const r = secR(s); if (r <= 0) return r <= -0.5 ? '#a01010' : SEC_COL[0]; return SEC_COL[Math.min(10, Math.round(r * 10))]; };
const constCol = i => `hsl(${(i * 137.508) % 360} 62% 60%)`;
/* Default look: known space in shades of grey (high-sec lightest, null-sec darkest),
   so that only wormhole systems and their connections stand out, in the mapper's colour per destination class. */
function secGrey(s){
  const r = secR(s);
  const L = r >= 0.5 ? 78 + (r - 0.5) * 30 : r > 0 ? 50 + (r - 0.1) * 25 : 30 + (r + 1) * 6;
  return `hsl(222 9% ${L.toFixed(0)}%)`;
}
const WH_COL = { HS:'#4fc36b', LS:'#e0a43a', NS:'#e05a4f', C1:'#52b6e8', C2:'#4f8de8', C3:'#7c74e8', C4:'#b06ce0', C5:'#e06cb8', C6:'#e85a6c',
  THERA:'#e8d25a', TURNUR:'#f28c5a', C13:'#9aa6b8', DRIFT:'#5ad6c6', POCH:'#d65a9a', J:'#c07cff' };
const WH_LABEL = { HS:'High-sec', LS:'Low-sec', NS:'Null-sec', C1:'C1', C2:'C2', C3:'C3', C4:'C4', C5:'C5', C6:'C6', THERA:'Thera', TURNUR:'Turnur', C13:'C13', DRIFT:'Drifter', POCH:'Pochven', J:'J-space' };
const THERA_ID = '31000005', TURNUR_ID = '30002086';
function classOf(id){                       // destination class of a system, for colouring the hole that leads there
  id = String(id);
  if (id === THERA_ID) return 'THERA';
  if (id === TURNUR_ID) return 'TURNUR';
  const n = mapper.nodes[id], c = n && n.cls ? String(n.cls).toUpperCase() : '';
  if (WH_COL[c]) return c;
  const sc = scout.find(l => String(l.b) === id && l.clsTxt), sct = sc ? String(sc.clsTxt).toUpperCase() : '';
  if (WH_COL[sct]) return sct;
  const s = byId[id] ? byId[id].s : index && index.sys[id] ? index.sys[id][2] : null;
  if (s != null){ const r = secR(s); return r >= 0.5 ? 'HS' : r > 0 ? 'LS' : 'NS'; }
  if (Number(id) >= 32000000) return 'POCH';
  return isJ(id) ? 'J' : 'J';
}
// colour of the far side of a hole seen from `here`
const holeCol = (here, other) => WH_COL[classOf(other)] || WH_COL.J;
/* systems of this region touched by an active hole, with the colour of where the hole leads */
function whTouch(){
  const m = {};
  for (const l of allHoles()){
    const a = String(l.a), b = String(l.b);
    if (byId[a] && !byId[a].ext && !m[a]) m[a] = holeCol(a, b);
    if (byId[b] && !byId[b].ext && !m[b]) m[b] = holeCol(b, a);
  }
  return m;
}

/* ---------- State ---------- */
let index = null;            // { regions:[{id,name,slug,n}], sys:{id:[name, regionId]} }
let R = null;                // current region data
let byId = {}, adj = {}, norm = {}, constIdx = {};
let sel = null;              // selected system id (string)
let route = null;            // { ids:[...], edges:Set }
let follow = store.get('whmap.reg.follow', true);
let colorMode = store.get('whmap.reg.color', 'wh'); if (colorMode === 'auto') colorMode = 'wh';
let drops = store.get('whmap.reg.drops', false);
const cam = { yaw:0, pitch:58 * Math.PI / 180, zoom:1, px:0, py:0, hx:1 };
let tok = null, clientId = '', me = { sys:null, name:'' };
let mapper = { nodes:{}, links:{}, pilots:{} };
const nameCache = {};

/* ---------- Data ---------- */
async function loadIndex(){
  const r = await fetch(DATA + 'index.json'); if (!r.ok) throw new Error('Region index missing');
  index = await r.json();
  index.regions.sort((a, b) => a.name.localeCompare(b.name));
  $('#regSel').innerHTML = index.regions.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('');
  $('#sysList').innerHTML = Object.entries(index.sys).map(([id, v]) => `<option value="${esc(v[0])}">`).join('');
}
const regionOf = id => { const v = index && index.sys[String(id)]; return v ? v[1] : null; };
const sysName = id => { id = String(id); return (byId[id] && byId[id].n) || (index && index.sys[id] && index.sys[id][0]) || (mapper.nodes[id] && mapper.nodes[id].name) || nameCache[id] || id; };
const isJ = id => Number(id) >= 31000000 && Number(id) < 32000000;

async function loadRegion(id, keepCam){
  id = Number(id);
  const r = await fetch(DATA + id + '.json'); if (!r.ok){ toast('No data for this region', true); return; }
  R = await r.json();
  byId = {}; adj = {}; constIdx = {};
  Object.keys(R.constellations).forEach((c, i) => constIdx[c] = i);
  for (const s of R.systems){ byId[String(s.id)] = s; adj[String(s.id)] = []; }
  for (const [a, b] of R.links){ adj[String(a)].push(String(b)); adj[String(b)].push(String(a)); }
  // normalise around the region's own systems
  const own = R.systems.filter(s => !s.ext);
  const c = own.reduce((m, s) => ({ x:m.x + s.x / own.length, y:m.y + s.y / own.length, z:m.z + s.z / own.length }), { x:0, y:0, z:0 });
  let rad = 1; for (const s of own) rad = Math.max(rad, Math.hypot(s.x - c.x, s.z - c.z, s.y - c.y));
  norm = {}; for (const s of R.systems) norm[String(s.id)] = { x:(s.x - c.x) / rad, y:(s.y - c.y) / rad, z:(s.z - c.z) / rad };
  $('#regSel').value = String(id);
  document.title = `${R.region.name} · Anoikis Traveler`;
  const slug = (index.regions.find(g => g.id === id) || {}).slug || id;
  history.replaceState(null, '', `?r=${slug}${DEMO ? '&demo' : ''}`);
  store.set('whmap.reg.last', id);
  if (!keepCam){ cam.zoom = 1; cam.px = 0; cam.py = 0; }
  if (sel && !byId[sel]) sel = null;
  computeRoute(); render(); renderPanel();
}

/* ---------- Mapper data (read-only, from the mapper's browser cache) ---------- */
function readMapper(){
  if (DEMO){ mapper = demoMapper(); return; }
  const cid = (tok && tok.charId) || store.get('whmap.lastChar', null);
  const slot = cid ? store.get(CK.slot + cid, null) : null;
  let m = slot && slot.mapOwner ? store.get('whmap.cache.' + slot.mapOwner, null) : null;
  if (!m) m = store.get('whmap.map', null);
  m = m || {};
  const objs = v => Array.isArray(v) ? Object.fromEntries(v.filter(Boolean).map(x => [x.id, x])) : (v || {});
  mapper = { nodes:m.nodes || {}, links:objs(m.links), pilots:m.pilots || {} };
}
/* Same rule as the mapper: past its estimated lifetime a wormhole blinks for 1 h, then it no longer counts.
   Lifetime by type from the mapper's wormhole data (same browser storage), 48 h if the type is unknown; 4 h after EOL. */
const whTypes = () => { const d = store.get('whmap.data2', null); return (d && d.types) || {}; };
function whPhase(l){
  const now = Date.now();
  if (l.type === 'gate') return 'ok';
  if (l.src === 'eve-scout') return l.expires && l.expires <= now ? 'dead' : 'ok';
  const t = l.wh && whTypes()[String(l.wh).toUpperCase()], out = [];
  if (l.eol && l.eolAt) out.push(l.eolAt + 4 * 3600e3);
  if (l.created) out.push(l.created + (t && t.life ? t.life : 48) * 3600e3);
  if (!out.length) return 'ok';
  const d = Math.min(...out);
  return now < d ? 'ok' : now < d + 3600e3 ? 'dying' : 'dead';
}
const whAlive = l => whPhase(l) !== 'dead';
const whLinks = () => Object.values(mapper.links).filter(l => l && l.type !== 'gate' && l.a != null && l.b != null && whPhase(l) !== 'dead');
/* Drop-down: one shortcut per region that has an active wormhole connection on the mapper, then its systems */
function renderWhSel(){
  const sel_ = $('#whSel'); if (!sel_ || !index) return;
  const byReg = {};
  for (const l of allHoles()){
    if (!whAlive(l)) continue;
    for (const [here, other] of [[l.a, l.b], [l.b, l.a]]){
      const reg = regionOf(here); if (!reg) continue;               // J-space side: no region page
      (byReg[reg] = byReg[reg] || []).push({ here:String(here), other:String(other), l });
    }
  }
  const regs = Object.keys(byReg).sort((a, b) => regionName(a).localeCompare(regionName(b)));
  const n = regs.reduce((m, r) => m + byReg[r].length, 0);
  const lab = l => [l.wh, l.size && l.size !== '?' ? l.size : '', l.eol ? 'EOL' : '', l.src === 'eve-scout' ? 'EvE-Scout' : ''].filter(Boolean).join(' ');
  sel_.innerHTML = `<option value="">${regs.length ? `⟿ WH regions (${regs.length})` : '⟿ No active wormhole'}</option>` + regs.map(r =>
    `<option class="r" value="r:${r}">${esc(regionName(r))} · ${byReg[r].length} WH</option>` +
    byReg[r].sort((a, b) => sysName(a.here).localeCompare(sysName(b.here))).map(c =>
      `<option value="s:${c.here}">\u00a0\u00a0\u00a0${esc(sysName(c.here))} → ${esc(sysName(c.other))}${lab(c.l) ? ' · ' + esc(lab(c.l)) : ''}</option>`).join('')).join('');
  sel_.disabled = !n;
  const unknown = [...new Set(regs.flatMap(r => byReg[r].map(c => c.other)))].filter(id => sysName(id) === id && !(id in nameCache)).slice(0, 15);
  if (unknown.length) Promise.all(unknown.map(async id => { await lookupName(id); if (!(id in nameCache)) nameCache[id] = id; })).then(renderWhSel);
}
/* ---------- Thera & Turnur: their whole network, straight from EVE-Scout (same source as the mapper) ---------- */
const HUB_LIST = ['31000005', '30002086'];                 // Thera, Turnur
const HUB_CLASS = { '31000005':'THERA', '30002086':'TURNUR' };
const SCOUT_SIZE = { small:'S', medium:'M', large:'L', xlarge:'XL', capital:'XL' };
let scout = [], scoutT = 0;
async function loadScout(){
  if (DEMO){ scout = demoScout(); scoutT = Date.now(); renderWhSel(); if (R){ computeRoute(); render(); renderPanel(); } return; }
  try{
    const r = await fetch('https://api.eve-scout.com/v2/public/signatures'); if (!r.ok) throw 0;
    const j = await r.json();
    scout = (Array.isArray(j) ? j : []).filter(c => c && (c.signature_type || 'wormhole') === 'wormhole' && HUB_LIST.includes(String(c.out_system_id)) && c.in_system_id).map(c => {
      if (c.in_system_name) nameCache[String(c.in_system_id)] = c.in_system_name;
      return { id:'es' + c.id, a:Number(c.out_system_id), b:Number(c.in_system_id), type:'wh', src:'eve-scout', wh:c.wh_type || '', size:SCOUT_SIZE[String(c.max_ship_size || '').toLowerCase()] || '?',
               expires:Date.parse(c.expires_at) || null, mass:'fresh', eol:false, outSig:c.out_signature || '', inSig:c.in_signature || '', regionTxt:c.in_region_name || '', clsTxt:c.in_system_class || '' };
    });
    scoutT = Date.now();
  }catch(e){}
  renderWhSel(); if (R){ computeRoute(); render(); renderPanel(); }
}
nameCache['31000005'] = 'Thera';
/* every active hole: the mapper's chain plus EVE-Scout's Thera/Turnur connections (no duplicates) */
function allHoles(){
  const out = whLinks(), seen = new Set(out.map(l => pairKey(l.a, l.b)));
  for (const l of scout) if (whPhase(l) !== 'dead' && !seen.has(pairKey(l.a, l.b))){ seen.add(pairKey(l.a, l.b)); out.push(l); }
  return out;
}
const isHubVirtual = id => HUB_LIST.includes(String(id)) && !byId[String(id)];
const pilotsAt = id => Object.values(mapper.pilots).filter(p => p && String(p.sys) === String(id) && (!p.t || Date.now() - p.t < 30 * 60000))
  .concat(Object.values(chars).filter(c => c.sys === String(id) && (!tok || c.name !== tok.charName)).map(c => ({ name:c.name, sys:c.sys })))
  .filter((p, i, a) => a.findIndex(q => q.name === p.name) === i);

/* ---------- Demo mode (?demo): simulated characters, chain and Thera; nothing is read from or written to EVE ---------- */
const DEMO = new URLSearchParams(location.search).has('demo');
const DEMO_CHARS = [{ charId:90000001, charName:'Demo Pilot', demo:true, exp:Infinity }, { charId:90000002, charName:'Demo Scout', demo:true, exp:Infinity }];
let demoPos = { 90000001:null, 90000002:'31000123' }, demoSeen = new Set();
const sysByName = n => { for (const id in index.sys) if (index.sys[id][0] === n) return id; return null; };
function demoMapper(){
  const K = n => sysByName(n);
  const nodes = { '31000123':{ id:31000123, name:'J000123', cls:'C3' }, '31000900':{ id:31000900, name:'J000900', cls:'C5' }, '31000901':{ id:31000901, name:'J000901', cls:'C2' } };
  for (const n of ['KDG-TA', '4M-QXK', '5M2-KP']){ const id = K(n); if (id) nodes[id] = { id:Number(id), name:n, cls:'NS' }; }
  const now = Date.now(), L = (id, a, b, o) => ({ id, a:Number(a), b:Number(b), type:'wh', mass:'fresh', eol:false, size:'L', created:now - 3600e3, ...o });
  return { nodes, pilots:{ c1:{ name:'Corpmate', sys:K('4M-QXK'), ship:'Tengu', t:now } },
    links:{ d1:L('d1', K('KDG-TA'), 31000123, { wh:'N062' }), d2:L('d2', 31000123, 31000900, { wh:'H296', size:'XL' }), d3:L('d3', 31000900, 31000901, { wh:'D382', mass:'reduced' }),
            d4:L('d4', K('4M-QXK'), K('5M2-KP'), { wh:'K162', size:'XL', eol:true, eolAt:now - 3600e3 }) } };
}
function demoScout(){
  const now = Date.now(), K = n => Number(sysByName(n)), S = (i, hub, b, wh, size, h, cls) => ({ id:'demo' + i, a:hub, b, type:'wh', src:'eve-scout', wh, size, expires:now + h * 3600e3, mass:'fresh', eol:false, outSig:'ABC-' + (100 + i), inSig:'XYZ-' + (200 + i), clsTxt:cls || '' });
  nameCache['31000456'] = 'J000456'; nameCache['31002002'] = 'J002002';
  return [S(1, 31000005, K('TTP-2B'), 'Q063', 'L', 9), S(2, 31000005, K('Perimeter'), 'Q063', 'XL', 14), S(3, 31000005, K('Amarr'), 'Q063', 'L', 5), S(4, 31000005, K('Dodixie'), 'Q063', 'M', 2),
          S(5, 31000005, 31000123, 'Q063', 'L', 11, 'c3'), S(6, 31000005, 31000456, 'Q063', 'L', 7, 'c5'), S(7, 31000005, 31002002, 'Q063', 'M', 3, 'c6'),
          S(8, 30002086, K('O-9G5Y'), 'Q063', 'L', 12), S(9, 30002086, K('Jita'), 'Q063', 'XL', 16)].filter(l => l.a && l.b);
}
function demoStep(){                       // the demo pilot flies a gate every few seconds, never back where it just was
  const cur = demoPos[90000001];
  if (!cur || !adj[cur]){ demoPos[90000001] = sysByName('5M2-KP') || (R && String(R.systems[0].id)); return; }
  const next = adj[cur].filter(n => byId[n] && !byId[n].ext);
  const fresh = next.filter(n => !demoSeen.has(n));
  const pick = (fresh.length ? fresh : next)[Math.floor(Math.random() * (fresh.length ? fresh : next).length)];
  if (pick){ demoSeen.add(cur); if (demoSeen.size > 12) demoSeen = new Set([...demoSeen].slice(-12)); demoPos[90000001] = pick; }
}

/* ---------- EVE login, straight from this page (same tokens as the rest of the site) ---------- */
const ROOT = location.origin + location.pathname.replace(/regions\/(index\.html)?$/, '');   // the callback registered with EVE
const SCOPES = 'esi-location.read_location.v1 esi-location.read_online.v1 esi-location.read_ship_type.v1';
const AS_SCOPE = 'esi-assets.read_assets.v1', ST_SCOPE = 'esi-universe.read_structures.v1';
const chars = {};                          // charId -> { sys, online }
function jwt(t){ try{ return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); }catch(e){ return {}; } }
const scopesOf = t => { if (!t || !t.access_token) return []; const s = jwt(t.access_token).scp; return Array.isArray(s) ? s : (s ? [s] : []); };
const canWp = () => DEMO || (!!tok && scopesOf(tok).includes(WP_SCOPE));
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
function vaultChars(){
  if (DEMO) return DEMO_CHARS;
  const out = [];
  try{ for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith(CK.tok)){ const t = store.get(k, null); if (t && t.charId) out.push(t); } } }catch(e){}
  return out.sort((a, b) => String(a.charName).localeCompare(String(b.charName)));
}
function pickChar(){
  const list = vaultChars();
  let id = Number(sess.get('whmap.tabChar')) || store.get('whmap.lastChar', null);
  if (!list.some(c => c.charId === id)) id = list.length ? list[0].charId : null;
  tok = DEMO ? (list.find(c => c.charId === id) || null) : (id ? store.get(CK.tok + id, null) : null);
  if (id) sess.set('whmap.tabChar', String(id));
  const cached = !DEMO && id ? store.get(CK.me + id, null) : null;
  me = { sys:DEMO ? (demoPos[id] || null) : chars[id] && chars[id].sys ? chars[id].sys : cached && cached.current != null && /^\d+$/.test(String(cached.current)) ? String(cached.current) : null, name:tok ? tok.charName : '' };
}
async function getClientId(){
  if (clientId) return clientId;
  const c = store.get('whmap.cfg', {}); if (c && c.clientId) return clientId = c.clientId;
  try{ const r = await fetch('../site.json', { cache:'no-store' }); if (r.ok){ const j = await r.json(); if (j.clientId) clientId = j.clientId; } }catch(e){}
  return clientId;
}
async function login(){
  if (DEMO){ location.href = './'; return; }
  const cid = await getClientId();
  if (!cid){ toast('The site has no EVE application configured (site.json).', true); return; }
  if (!window.crypto || !crypto.subtle){ toast('This browser blocks login here: use the https address.', true); return; }
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  const state = 'rg' + b64url(crypto.getRandomValues(new Uint8Array(12)));      // "rg": the site root sends the answer back here
  sess.set('whmap.reg.pkce', JSON.stringify({ verifier, state }));
  const wp = store.get('whmap.reg.askwp', true), as = store.get('whmap.reg.askassets', true);
  const p = new URLSearchParams({ response_type:'code', redirect_uri:ROOT, client_id:cid, scope:SCOPES + (wp ? ' ' + WP_SCOPE : '') + (as ? ` ${AS_SCOPE} ${ST_SCOPE}` : ''), code_challenge:challenge, code_challenge_method:'S256', state });
  location.href = `${SSO}/authorize/?${p}`;
}
async function tokenRequest(params){
  const r = await fetch(`${SSO}/token`, { method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' }, body:new URLSearchParams(params) });
  if (!r.ok) throw new Error('EVE refused the login (' + r.status + ')');
  const j = await r.json(), claims = jwt(j.access_token);
  return { access_token:j.access_token, refresh_token:j.refresh_token, exp:(claims.exp || 0) * 1000, charId:Number(String(claims.sub || '').split(':').pop()), charName:claims.name || '' };
}
async function handleCallback(){
  const q = new URLSearchParams(location.search);
  if (!q.has('code') && !q.has('error')) return;
  let saved = null; try{ saved = JSON.parse(sess.get('whmap.reg.pkce') || 'null'); }catch(e){}
  history.replaceState(null, '', location.pathname);
  if (q.has('error')){ toast('Login cancelled', true); return; }

/* ---------- Routes (gates of this region + wormholes from the mapper) ---------- */
function graph(){
  const g = {};
  const add = (a, b, k) => { (g[a] = g[a] || []).push([b, k]); (g[b] = g[b] || []).push([a, k]); };
  for (const [a, b] of R.links) add(String(a), String(b), 'g:' + [a, b].sort().join('-'));
  for (const l of allHoles()) add(String(l.a), String(l.b), 'w:' + l.id);

}
function computeRoute(){
  route = null;

  const g = graph(); if (!g[me.sys]) return;
  const prev = { [me.sys]:null }, q = [me.sys];
  while (q.length){ const u = q.shift(); if (u === sel) break; for (const [v, k] of g[u] || []) if (!(v in prev)){ prev[v] = [u, k]; q.push(v); } }
  if (!(sel in prev)) return;
  const ids = [], edges = new Set(); let u = sel;
  while (u){ ids.unshift(u); const p = prev[u]; if (!p) break; edges.add(p[1]); u = p[0]; }
  route = { ids, edges };
}

/* ---------- 3D projection ---------- */
let W = 800, H = 600;
function proj(p){
  const c = Math.cos(cam.yaw), s = Math.sin(cam.yaw);
  const rx = p.x * c - p.z * s, rn = p.x * s + p.z * c;     // ground: x = east, z = north
  const sp = Math.sin(cam.pitch), cp = Math.cos(cam.pitch), up = p.y * cam.hx;
  const S = Math.min(W, H) * 0.44 * cam.zoom;
  return { x:W / 2 + cam.px + rx * S, y:H / 2 + cam.py - (rn * sp + up * cp) * S, d:rn * cp - up * sp };
}
function centerOn(id, soft){
  const p = norm[String(id)]; if (!p) return;
  const save = [cam.px, cam.py]; cam.px = 0; cam.py = 0;
  const q = proj(p);
  const tx = W / 2 - q.x, ty = H / 2 - q.y;
  if (soft){ // only recenter if the system is near the edge
    const cur = { x:q.x + save[0], y:q.y + save[1] };
    if (cur.x > W * 0.15 && cur.x < W * 0.85 && cur.y > H * 0.15 && cur.y < H * 0.85){ cam.px = save[0]; cam.py = save[1]; return; }
  }
  cam.px = tx; cam.py = ty;
}

let hubNodes = [];
function placeHubs(){
  hubNodes = [];
  if (!R) return;
  for (const h of HUB_LIST){
    if (byId[h] && !byId[h].ext){                                 // Turnur inside Metropolis: a real system, same label
      const all = allHoles().filter(l => String(l.a) === h || String(l.b) === h);
      if (all.length) hubNodes.push({ h, conns:all.filter(l => byId[String(String(l.a) === h ? l.b : l.a)]), exits:[], real:true });
      continue;
    }
    if (byId[h]) continue;
    const conns = allHoles().filter(l => (String(l.a) === h && byId[String(l.b)]) || (String(l.b) === h && byId[String(l.a)]));
    if (conns.length) hubNodes.push({ h, conns, exits:conns.map(l => String(String(l.a) === h ? l.b : l.a)) });

/* On screen: close to its exits, on a free spot (no system, label or other hub under it), inside the view.

const hubOff = {};
function placeHubsScreen(P){
  const pts = [];
  for (const id in P) if (byId[id]) pts.push(P[id]);
  const taken = [];
  const boxes = [...document.querySelectorAll('.widget')].filter(w => !w.hidden).map(w => w.getBoundingClientRect());   // not under a window
  const cost = (q, exits) => {
    let c = 0;
    for (const r of boxes) if (q.x > r.left - 30 && q.x < r.right + 30 && q.y > r.top - 50 && q.y < r.bottom + 20) c += 20000;
    if (q.x < 70 || q.x > W - 70 || q.y < 60 || q.y > H - 50) c += 1e6;
    for (const p of pts){
      const dx = q.x - p.x, dy = q.y - p.y;
      if (dx * dx + dy * dy < 40 * 40) c += 5000;
      if (p.x - 30 < q.x && q.x < p.x + 110 && Math.abs(q.y - p.y) < 16) c += 1200;      // its label
      if (q.x - 60 < p.x && p.x < q.x + 60 && q.y - 46 < p.y && p.y < q.y - 14) c += 600;  // our own label above
    }
    for (const t of taken){ const dx = q.x - t.x, dy = q.y - t.y; if (dx * dx + dy * dy < 120 * 120) c += 8000; }
    const d = exits.reduce((m, e) => m + Math.hypot(q.x - e.x, q.y - e.y), 0) / exits.length;
    return c + d;
  };

/* Destination / waypoint in the EVE client (needs the mapper's login with the waypoint option) */
async function sendWaypoint(id, add){

  if (!tok){ toast('Log in with EVE first (Characters window)', true); return; }
  if (!canWp()){ toast('This character was logged in without "Set destination": log in again with that option ticked', true); return; }
  try{ const q = new URLSearchParams({ add_to_beginning:'false', clear_other_waypoints:String(!add), destination_id:id });
    await esiAuth(`/ui/autopilot/waypoint/?${q}`, { method:'POST' }); toast(add ? `Waypoint added: ${sysName(id)}` : `Destination set: ${sysName(id)}`);
    apSetFrom(id, add); }

function select(id){ sel = id == null ? null : String(id); computeRoute(); render(); renderPanel(); }

/* ---------- Autopilot route widget ----------
   After "Set destination" / "Add waypoint": the systems still to cover, in a column, trimmed at each jump.
   Route from CCP's route service, with the mapper's wormholes given as extra connections. */
let ap = null;                // { dests:[ids], pref, open, arrived, path:[ids], whp:{pair:label}, err }
let apSeq = 0, apT = null;
const pairKey = (a, b) => [String(a), String(b)].sort().join('|');

function apLoad(){ ap = store.get(apKey(), null); if (ap && !Array.isArray(ap.dests)) ap = null; }
function apSave(){
  if (!ap){ try{ localStorage.removeItem(apKey()); }catch(e){} return; }
  store.set(apKey(), { dests:ap.dests, pref:ap.pref, open:ap.open, arrived:ap.arrived || null });
}
function whConns(){
  const out = [];
  for (const l of allHoles()){ if (!/^\d+$/.test(String(l.a)) || !/^\d+$/.test(String(l.b))) continue;
    out.push({ from:Number(l.a), to:Number(l.b) }, { from:Number(l.b), to:Number(l.a) }); }

}
const routeCache = new Map();
async function esiRoute(a, b, pref, conns){
  const key = `${a}>${b}>${pref}>${JSON.stringify(conns)}`;
  if (routeCache.has(key)) return routeCache.get(key);
  const r = await fetch(`https://esi.evetech.net/route/${a}/${b}`, { method:'POST',
    headers:{ 'Content-Type':'application/json', 'X-Compatibility-Date':'2025-09-30' }, body:JSON.stringify({ preference:pref, connections:conns }) });
  if (!r.ok) throw new Error('CCP route service ' + r.status);
  const j = await r.json(), ids = (Array.isArray(j) ? j : j.route || []).map(String);

}
function apWhPairs(){ const m = {}; for (const l of allHoles()) m[pairKey(l.a, l.b)] = [l.wh, l.size && l.size !== '?' ? l.size : '', l.eol ? 'EOL' : ''].filter(Boolean).join(' ') || 'wormhole'; return m; }
async function computeAp(force){

  if (!me.sys){ ap.err = 'Waiting for your position…'; renderAp(); return; }
  let changed = false;
  while (ap.dests.length && ap.dests[0] === me.sys){ ap.dests.shift(); changed = true; }   // waypoint reached
  if (!ap.dests.length){
    if (changed || !ap.arrived) ap.arrived = me.sys;
    ap.path = [me.sys]; ap.err = ''; apSave(); renderAp(); render(); return;
  }
  ap.arrived = null;
  if (changed) apSave();
  if (!force && ap.path){
    const i = ap.path.indexOf(me.sys), w = ap.path.indexOf(ap.dests[0]);
    // still on the route, before the next waypoint: just trim
    if (i >= 0 && (w < 0 || i <= w)){ ap.path = ap.path.slice(i); renderAp(); render(); return; }
  }
  const my = ++apSeq;
  ap.err = ''; ap.busy = true; renderAp();
  try{
    const conns = whConns(); let from = me.sys; const path = [me.sys];
    for (const d of ap.dests){ const seg = await esiRoute(from, d, ap.pref, conns); path.push(...seg.slice(seg[0] === from ? 1 : 0)); from = d; }
    if (my !== apSeq) return;
    ap.path = path;
  }catch(e){ if (my !== apSeq) return; ap.path = null; ap.err = `No route found (${e.message}).`; }
  ap.busy = false; ap.whp = apWhPairs();

}
const scheduleAp = () => { if (!ap) return; clearTimeout(apT); apT = setTimeout(() => computeAp(true), 1200); };

function keepPivot(fn){

function zoomAround(f, sx, sy){            // sx, sy: screen point relative to the view centre

function setupInput(){

    start = { x:e.clientX, y:e.clientY, pan:e.shiftKey || e.button === 2 || e.button === 1, target:e.target.closest('.sys'), chest:e.target.closest('[data-assets]') };
    moved = false;
  });
  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (ptrs.size === 2 && pinch){ const [a, b] = [...ptrs.values()]; const want = Math.max(0.3, Math.min(12, pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d)); const r0 = svg.getBoundingClientRect(); zoomAround(want / cam.zoom, (a.x + b.x) / 2 - r0.left - W / 2, (a.y + b.y) / 2 - r0.top - H / 2); moved = true; return; }
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;

  $('#btnTop').onclick = () => { keepPivot(() => { cam.yaw = 0; cam.pitch = Math.PI / 2; }); render(); };
  const ab = $('#btnAssets'); ab.setAttribute('aria-pressed', String(assetsOn));
  ab.onclick = async () => { assetsOn = !assetsOn; store.set('whmap.reg.assets', assetsOn); ab.setAttribute('aria-pressed', String(assetsOn)); render(); renderPanel();
    if (assetsOn){ await loadAssets(); const miss = vaultChars().filter(c => assetData[c.charId] && assetData[c.charId].err === 'scope').map(c => c.charName);

  $('#colorSel').value = colorMode;
  $('#colorSel').onchange = e => { colorMode = e.target.value; store.set('whmap.reg.color', colorMode); render(); renderPanel(); };
  const fb = $('#btnFollow'); fb.setAttribute('aria-pressed', String(follow));
  fb.onclick = () => { follow = !follow; store.set('whmap.reg.follow', follow); fb.setAttribute('aria-pressed', String(follow)); if (follow) onMove(); };
  $('#search').addEventListener('change', e => {
    const q = e.target.value.trim().toLowerCase(); if (!q) return;
    const hit = Object.entries(index.sys).find(([, v]) => v[0].toLowerCase() === q) || Object.entries(index.sys).find(([, v]) => v[0].toLowerCase().startsWith(q));
    if (hit){ follow = false; store.set('whmap.reg.follow', false); fb.setAttribute('aria-pressed', 'false'); goTo(hit[0]); e.target.value = ''; }
    else toast('No system called ' + e.target.value, true);
  });
  // the mapper (other tab) updates its cache, pilots and tokens: follow along
  window.addEventListener('storage', e => {
    if (!e.key || !e.key.startsWith('whmap.')) return;
    if (e.key.startsWith('whmap.cache.') || e.key === 'whmap.map'){ readMapper(); renderWhSel(); computeRoute(); render(); renderPanel(); scheduleAp(); if (!$('#wChain').hidden) buildChains(); }
    else if (e.key.startsWith(CK.tok) && !tok){ pickChar(); renderWho(); poll(); }
  });
  $('#apHead').onclick = () => { if (!ap) return; ap.open = ap.open === false; apSave(); renderAp(); };
  $('#apPref').onchange = e => { if (!ap) return; ap.pref = e.target.value; store.set('whmap.reg.pref', ap.pref); apSave(); computeAp(true); };
  $('#apClear').onclick = () => { ap = null; apSave(); renderAp(); render(); };
  $('#hubCards').addEventListener('click', e => {
    const tg = e.target.closest('[data-tog]'), wpb = e.target.closest('[data-wp]'), go = e.target.closest('[data-go]');
    if (wpb){ e.stopPropagation(); if (!wpb.disabled) sendWaypoint(wpb.dataset.wp, e.shiftKey); return; }
    if (tg) return;                                   // handled on pointerup (drag or fold)
    if (go){ const id = go.dataset.go; if (isJ(id) && !HUB_LIST.includes(id)) toast(`${sysName(id)}: wormhole space, no region map`); else { follow = false; $('#btnFollow').setAttribute('aria-pressed', 'false'); goTo(id); } }
  });
  window.addEventListener('resize', render);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
}

/* ---------- Chain widget: flat map of the mapper's chains ----------
   Systems linked by wormholes (and the gates you mapped) form a group. Two groups are the same chain when their
   known-space systems are within X gate jumps (X set by the player); otherwise the other ones are secondary chains. */
let chainX = store.get('whmap.reg.chainX', 5), chainPick = null, chainGroups = [], chainBusy = 0;
const jumpCache = store.get('whmap.reg.jumps', {});
async function jumps(a, b){
  const k = a < b ? a + '>' + b : b + '>' + a;
  if (jumpCache[k] != null) return jumpCache[k];
  try{ const r = await fetch(`https://esi.evetech.net/route/${a}/${b}`, { method:'POST', headers:{ 'Content-Type':'application/json', 'X-Compatibility-Date':'2025-09-30' }, body:JSON.stringify({ preference:'Shorter' }) });
       if (!r.ok) throw 0; const j = await r.json(), ids = Array.isArray(j) ? j : j.route || []; jumpCache[k] = ids.length ? ids.length - 1 : 999; }
  catch(e){ return 999; }
  store.set('whmap.reg.jumps', jumpCache);
  return jumpCache[k];
}
const isK = id => !!(index && index.sys[String(id)]);
function chainLinks(){ return Object.values(mapper.links).filter(l => l && l.a != null && l.b != null && (l.type === 'gate' || whPhase(l) !== 'dead')); }
async function buildChains(){
  const my = ++chainBusy;
  const links = chainLinks(), adjm = {};
  for (const l of links){ const a = String(l.a), b = String(l.b); (adjm[a] = adjm[a] || []).push(b); (adjm[b] = adjm[b] || []).push(a); }
  const seen = new Set(), comps = [];
  for (const id of Object.keys(adjm)){
    if (seen.has(id) || HUB_LIST.includes(id)) continue;
    const c = [id]; seen.add(id);
    for (let i = 0; i < c.length; i++) for (const v of adjm[c[i]]) if (!seen.has(v) && !HUB_LIST.includes(v)){ seen.add(v); c.push(v); }
    comps.push(c);
  }
  // merge groups whose known-space systems are close enough by gates
  const par = comps.map((_, i) => i), find = i => par[i] === i ? i : (par[i] = find(par[i]));
  const bridges = [];
  for (let i = 0; i < comps.length; i++) for (let j = i + 1; j < comps.length; j++){
    const ki = comps[i].filter(isK).slice(0, 6), kj = comps[j].filter(isK).slice(0, 6);
    if (!ki.length || !kj.length) continue;
    let best = null;
    for (const a of ki) for (const b of kj){ const d = await jumps(a, b); if (my !== chainBusy) return; if (!best || d < best.d) best = { a, b, d }; }
    if (best && best.d <= chainX){ par[find(i)] = find(j); bridges.push(best); }
  }
  const groups = {};
  comps.forEach((c, i) => (groups[find(i)] = groups[find(i)] || []).push(...c));
  const homeId = (store.get('whmap.cfg', {}).home || {}).id, mine = new Set(Object.values(chars).map(c => c.sys).concat(me.sys ? [me.sys] : []));
  chainGroups = Object.values(groups).map(ids => {
    const set = new Set(ids);
    return { ids, set, home:homeId != null && set.has(String(homeId)), mine:ids.some(id => mine.has(id)), bridges:bridges.filter(b => set.has(b.a) && set.has(b.b)) };
  }).sort((a, b) => (b.home - a.home) || (b.mine - a.mine) || b.ids.length - a.ids.length);
  renderChainSel(); renderChain();
}
function chainName(g, i){
  const named = g.ids.find(id => isJ(id)) || g.ids[0];
  return `${i === 0 ? 'Main chain' : 'Secondary ' + i} · ${sysName(named)}${g.ids.length > 1 ? ` +${g.ids.length - 1}` : ''}${g.home ? ' · home' : ''}`;
}
function renderChainSel(){
  const sel_ = $('#chainSel'); if (!sel_) return;
  if (chainPick != null && chainPick >= chainGroups.length) chainPick = null;
  sel_.innerHTML = chainGroups.length ? chainGroups.map((g, i) => `<option value="${i}">${esc(chainName(g, i))}</option>`).join('') : '<option>No chain on your mapper</option>';
  sel_.value = String(chainPick || 0);
  $('#chainSub').textContent = chainGroups.length > 1 ? `${chainGroups.length} chains` : '';
}
let chainView = { k:1, x:0, y:0 };
function chainLayout(g){
  // the mapper's own flat layout when every system has one, otherwise a tree from the home / your system
  const ns = g.ids.map(id => mapper.nodes[id]);
  if (ns.every(n => n && isFinite(n.x) && isFinite(n.y))) return Object.fromEntries(g.ids.map(id => [id, { x:mapper.nodes[id].x, y:mapper.nodes[id].y }]));
  const homeId = String((store.get('whmap.cfg', {}).home || {}).id || '');
  const root = g.set.has(homeId) ? homeId : (me.sys && g.set.has(me.sys) ? me.sys : g.ids.find(isJ) || g.ids[0]);
  const adjm = {}; const add = (a, b) => { (adjm[a] = adjm[a] || []).push(b); (adjm[b] = adjm[b] || []).push(a); };
  for (const l of chainLinks()){ const a = String(l.a), b = String(l.b); if (g.set.has(a) && g.set.has(b)) add(a, b); }
  for (const br of g.bridges) add(br.a, br.b);
  const depth = { [root]:0 }, cols = [[root]], q = [root];
  while (q.length){ const u = q.shift(); for (const v of adjm[u] || []) if (!(v in depth)){ depth[v] = depth[u] + 1; (cols[depth[v]] = cols[depth[v]] || []).push(v); q.push(v); } }
  g.ids.filter(id => !(id in depth)).forEach(id => { depth[id] = cols.length; (cols[cols.length] = cols[cols.length] || []).push(id); });
  const pos = {};
  cols.forEach((c, d) => c.forEach((id, k) => pos[id] = { x:d * 120, y:(k - (c.length - 1) / 2) * 52 }));
  return pos;
}
function renderChain(){
  const box = $('#wChain'); if (!box || box.hidden) return;
  const svg = $('#chainSvg'), W2 = svg.clientWidth || 420, H2 = svg.clientHeight || 260;
  svg.setAttribute('viewBox', `0 0 ${W2} ${H2}`); svg.innerHTML = '';
  $('#chainX').value = chainX;
  const g = chainGroups[chainPick || 0];
  if (!g){ $('#chainNote').textContent = DEMO ? '' : 'Your chain comes from the wormhole mapper of this site (same browser).'; return; }
  const pos = chainLayout(g), xs = Object.values(pos).map(p => p.x), ys = Object.values(pos).map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const fit = Math.min((W2 - 70) / Math.max(1, maxX - minX), (H2 - 50) / Math.max(1, maxY - minY), 1.4);
  const k = fit * chainView.k, ox = W2 / 2 - (minX + maxX) / 2 * k + chainView.x, oy = H2 / 2 - (minY + maxY) / 2 * k + chainView.y;
  const S = id => ({ x:pos[id].x * k + ox, y:pos[id].y * k + oy });
  const gE = el('g', {}, svg), gN = el('g', {}, svg);
  for (const l of chainLinks()){
    const a = String(l.a), b = String(l.b); if (!g.set.has(a) || !g.set.has(b)) continue;
    const pa = S(a), pb = S(b), cls = 'ce ' + (l.type === 'gate' ? 'gate' : (l.mass || 'fresh')) + (whPhase(l) === 'dying' ? ' dying' : '');
    const ln = el('line', { x1:pa.x, y1:pa.y, x2:pb.x, y2:pb.y, class:cls, style:l.type === 'gate' ? '' : `stroke:${l.eol ? 'var(--eol)' : l.mass === 'critical' ? 'var(--bad)' : l.mass === 'reduced' ? 'var(--warn)' : 'var(--wh)'}` }, gE);
    el('title', {}, ln).textContent = `${sysName(a)} ↔ ${sysName(b)} ${[l.wh, l.size !== '?' ? l.size : '', l.eol ? 'EOL' : '', l.mass].filter(Boolean).join(' · ')}`;
  }
  for (const br of g.bridges){
    const pa = S(br.a), pb = S(br.b);
    el('line', { x1:pa.x, y1:pa.y, x2:pb.x, y2:pb.y, class:'ce k' }, gE);
    const t = el('text', { x:(pa.x + pb.x) / 2, y:(pa.y + pb.y) / 2 - 4, 'text-anchor':'middle', class:'cek' }, gE); t.textContent = `${br.d} j`;
  }
  const mine = {}; for (const c of Object.values(chars)) if (c.sys) (mine[c.sys] = mine[c.sys] || []).push(c.name);
  for (const id of g.ids){
    const p = S(id), cl = classOf(id), col = WH_COL[cl] || WH_COL.J;
    const n = el('g', { class:'cn', 'data-id':id }, gN);
    if (mine[id] || me.sys === id) el('circle', { cx:p.x, cy:p.y, r:13, fill:'none', stroke:'var(--ok)', 'stroke-width':2 }, n);
    el('circle', { cx:p.x, cy:p.y, r:8, fill:col, class:'b', stroke:'#05080f', 'stroke-width':1 }, n);
    el('circle', { cx:p.x, cy:p.y, r:8, fill:'url(#chainShine)', 'pointer-events':'none' }, n);
    const t = el('text', { x:p.x, y:p.y + 21, 'text-anchor':'middle' }, n); t.textContent = sysName(id);
    const t2 = el('text', { x:p.x, y:p.y - 13, 'text-anchor':'middle', class:'cls' }, n); t2.textContent = isK(id) ? secR(secOf(id)).toFixed(1) : cl;
    el('title', {}, n).textContent = `${sysName(id)} ${cl}${mine[id] ? ' · ' + mine[id].join(', ') : ''}${isK(id) ? ' · click: show its region' : ''}`;
  }
  const defs = el('defs', {}, svg), sh = el('radialGradient', { id:'chainShine', cx:'35%', cy:'30%', r:'75%' }, defs);
  el('stop', { offset:'0%', 'stop-color':'#fff', 'stop-opacity':'.6' }, sh); el('stop', { offset:'60%', 'stop-color':'#fff', 'stop-opacity':'0' }, sh); el('stop', { offset:'100%', 'stop-color':'#000', 'stop-opacity':'.45' }, sh);
  $('#chainNote').textContent = `${g.ids.length} systems${g.bridges.length ? ` · ${g.bridges.length} gate link${g.bridges.length > 1 ? 's' : ''} (dotted, jumps shown)` : ''} · drag to move, wheel to zoom, click a k-space system to open its region`;
}
function setupChain(){
  const box = $('#wChain'), btn = $('#btnChain'), svg = $('#chainSvg');
  const show = on => { box.hidden = !on; btn.setAttribute('aria-pressed', String(on)); store.set('whmap.reg.chainOpen', on); if (on){ placeWidget(box); box.style.zIndex = ++wz; buildChains(); } };
  btn.onclick = () => show(box.hidden);
  $('#chainSel').onchange = e => { chainPick = Number(e.target.value) || 0; chainView = { k:1, x:0, y:0 }; renderChain(); };
  $('#chainX').onchange = e => { chainX = Math.max(0, Math.min(40, Number(e.target.value) || 0)); store.set('whmap.reg.chainX', chainX); buildChains(); };
  let st = null;
  svg.addEventListener('pointerdown', e => { if (e.target.closest('.cn')) return; st = { x:e.clientX, y:e.clientY, vx:chainView.x, vy:chainView.y }; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', e => { if (!st) return; chainView.x = st.vx + e.clientX - st.x; chainView.y = st.vy + e.clientY - st.y; renderChain(); });
  svg.addEventListener('pointerup', () => st = null);
  svg.addEventListener('wheel', e => { e.preventDefault(); chainView.k = Math.max(0.3, Math.min(6, chainView.k * Math.exp(-e.deltaY * 0.0015))); renderChain(); }, { passive:false });
  svg.addEventListener('click', e => { const n = e.target.closest('.cn'); if (!n) return; const id = n.dataset.id; if (isK(id)){ follow = false; $('#btnFollow').setAttribute('aria-pressed', 'false'); goTo(id); } else toast(`${sysName(id)}: wormhole space, no region map`); });
  new ResizeObserver(() => renderChain()).observe(box.querySelector('.chainwb'));
  if (store.get('whmap.reg.chainOpen', false)) show(true);
  setInterval(() => { if (!box.hidden) buildChains(); }, 60000);
}

/* ---------- Widgets: every window floats over the map; drag by its title bar, fold with –, positions remembered ---------- */
let wstate = store.get('whmap.reg.widgets', {}), wz = 10;
function defaultPos(id, el){
  const W0 = innerWidth, H0 = innerHeight, w = el.offsetWidth || 300;
  const below = (other, fallback) => { const o = $('#' + other); return o && !o.hidden ? o.offsetTop + o.offsetHeight + 8 : fallback; };
  return { wTool:{ x:12, y:12 }, wView:{ x:12, y:below('wTool', 96) }, apBox:{ x:12, y:below('wView', 220) },
           wChars:{ x:W0 - w - 12, y:12 }, wInfo:{ x:W0 - w - 12, y:Math.min(H0 - 200, below('wChars', 250)) },
           wChain:{ x:Math.max(12, W0 / 2 - w / 2), y:Math.max(12, H0 - 420) },
           wAssets:{ x:Math.max(12, W0 - 760), y:90 } }[id] || { x:40, y:40 };
}
function placeWidget(el){
  const st = wstate[el.id] || {}, d = defaultPos(el.id, el);
  el.classList.toggle('folded', !!st.folded);
  const x = st.x != null ? st.x : d.x, y = st.y != null ? st.y : d.y;
  el.style.left = Math.max(4, Math.min(innerWidth - Math.min(el.offsetWidth, innerWidth - 8) - 4, x)) + 'px';
  el.style.top = Math.max(4, Math.min(innerHeight - 36, y)) + 'px';
}
function initWidget(el){
  const head = el.querySelector('.wh'), fold = el.querySelector('.wcol:not([id])');
  let st = null;
  el.addEventListener('pointerdown', () => { el.style.zIndex = ++wz; });
  head.addEventListener('pointerdown', e => {
    if (e.target.closest('button,a,select,input')) return;
    st = { x:e.clientX, y:e.clientY, l:el.offsetLeft, t:el.offsetTop }; head.setPointerCapture(e.pointerId); el.classList.add('dragging');
  });
  head.addEventListener('pointermove', e => {
    if (!st) return;
    el.style.left = Math.max(4 - el.offsetWidth + 60, Math.min(innerWidth - 60, st.l + e.clientX - st.x)) + 'px';
    el.style.top = Math.max(4, Math.min(innerHeight - 36, st.t + e.clientY - st.y)) + 'px';
  });
  const end = () => { if (!st) return; st = null; el.classList.remove('dragging'); wstate[el.id] = { ...(wstate[el.id] || {}), x:el.offsetLeft, y:el.offsetTop }; store.set('whmap.reg.widgets', wstate); };
  head.addEventListener('pointerup', end); head.addEventListener('pointercancel', end);
  head.addEventListener('dblclick', e => { if (!e.target.closest('button,a,select,input')) fold.click(); });
  fold.addEventListener('click', () => { const f = !el.classList.contains('folded'); el.classList.toggle('folded', f); fold.textContent = f ? '+' : '–'; wstate[el.id] = { ...(wstate[el.id] || {}), folded:f }; store.set('whmap.reg.widgets', wstate); });
  if ((wstate[el.id] || {}).folded) fold.textContent = '+';
  placeWidget(el);
}
// windows the player has not moved follow their neighbours once the content is in (sizes change after loading)
function relayoutDefaults(){ ['wTool', 'wChars', 'wView', 'wInfo', 'apBox', 'wChain', 'wAssets'].forEach(id => { const st = wstate[id]; if (!st || st.x == null) placeWidget($('#' + id)); }); }
function setupWidgets(){
  $('#assetsClose').onclick = () => { $('#wAssets').hidden = true; assetsSys = null; };
  ['wTool', 'wChars', 'wView', 'wInfo', 'apBox', 'wChain', 'wAssets'].forEach(id => initWidget($('#' + id)));
  addEventListener('resize', () => ['wTool', 'wChars', 'wView', 'wInfo', 'apBox', 'wChain', 'wAssets'].forEach(id => placeWidget($('#' + id))));
  $('#btnLayout').onclick = () => { wstate = {}; store.set('whmap.reg.widgets', wstate); for (const k in hubPos) delete hubPos[k]; store.set('whmap.reg.hubpos', hubPos);
    ['wTool', 'wChars', 'wView', 'wInfo', 'apBox', 'wChain', 'wAssets'].forEach(id => { const el = $('#' + id); el.querySelector('.wcol').textContent = '–'; placeWidget(el); }); render(); };
}

/* ---------- Start ---------- */
(async function init(){
  setupWidgets();
  try{ await loadIndex(); }catch(e){ $('#panel').innerHTML = `<p>${esc(e.message)}</p>`; return; }
  await handleCallback();
  pickChar(); readMapper(); apLoad(); setupInput(); renderChars(); renderWho(); renderWhSel();
  setInterval(() => { renderWhSel(); render(); }, 60000);   // holes age out even without a mapper change
  const q = new URLSearchParams(location.search);
  const qr = q.get('r'), qs = q.get('sys');
  let reg = null;
  if (qr){ const g = index.regions.find(x => x.slug === qr.toLowerCase() || String(x.id) === qr || x.name.toLowerCase() === qr.toLowerCase()); if (g) reg = g.id; }
  if (!reg && qs && regionOf(qs)) reg = regionOf(qs);
  if (!reg && me.sys && regionOf(me.sys)) reg = regionOf(me.sys);
  if (!reg && !DEMO) reg = store.get('whmap.reg.last', null);
  if (!reg || !index.regions.some(g => g.id === reg)) reg = (index.regions.find(g => g.slug === 'insmother') || index.regions[0]).id;
  if (qs){ follow = false; $('#btnFollow').setAttribute('aria-pressed', 'false'); }   // a system link is a deliberate look elsewhere
  await loadRegion(reg);
  if (DEMO){ demoStep(); pickChar(); }
  if (qs && byId[qs]){ select(qs); centerOn(qs); }
  else if (me.sys && byId[me.sys]) centerOn(me.sys);
  render(); computeAp(true);
  relayoutDefaults();
  setupChain();
  poll().then(relayoutDefaults);
  loadScout(); setInterval(loadScout, 5 * 60000);
  if (assetsOn) loadAssets(); setInterval(() => { if (assetsOn) loadAssets(); }, 60 * 60000);
})();
})();
