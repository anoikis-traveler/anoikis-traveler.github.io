<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anoikis Traveler · Region map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Region map: real EVE coordinates in 3D, live position from the mapper's EVE login, wormholes from the mapper. */
:root{
  --bg:#070a12; --panel:#0e1424; --panel-2:#141c30; --line:#24314c; --text:#e2e8f3; --dim:#8b98b0;
  --accent:#f2a74b; --ok:#5fd68a; --warn:#f2c94b; --bad:#ef5a5a; --eol:#c07cff; --wh:#8fb0d8; --ap:#4fd2ff;
  --display:"Saira Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel-2);border:1px solid var(--line);padding:5px 10px;border-radius:3px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:#1a1205;border-color:var(--accent);font-weight:600}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
input,select{background:var(--bg);border:1px solid var(--line);padding:5px 8px;border-radius:3px;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
a{color:var(--accent)}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-family:var(--display);font-size:1.45rem;margin:0 6px 0 0;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
header h1 a{color:inherit;text-decoration:none}
header h1 small{color:var(--accent)}
header .grow{flex:1}
#who{font-size:13px;white-space:nowrap}
#whSel{max-width:230px;border-color:var(--eol)}
#whSel option.r{font-weight:600}
#who b{color:var(--accent)}
main{display:grid;grid-template-columns:1fr 330px;min-height:0}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none}
#map{width:100%;height:100%;display:block;cursor:grab;user-select:none}
#map.dragging{cursor:grabbing}
#hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--dim);pointer-events:none}
#banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--eol);color:var(--text);padding:7px 14px;border-radius:4px;font-size:13px;display:none;z-index:3}
#banner.on{display:block}
#zoomBtns{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
#zoomBtns button{width:34px;height:34px;padding:0;font-size:18px}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 14px}
aside h2{font-family:var(--display);font-size:1.6rem;letter-spacing:.04em;margin:0 0 2px}
aside h3{font-family:var(--display);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:16px 0 6px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:10px;font-size:12px;margin:0 4px 4px 0}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:3px 0;border-bottom:1px solid rgba(36,49,76,.5);font-size:13px}
.lk{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline dotted}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);padding:8px 14px;border-radius:4px;display:none;z-index:9}
#toast.err{border-color:var(--bad)}
.legend span{display:inline-flex;align-items:center;gap:5px;margin:0 10px 4px 0;font-size:12px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid}
/* SVG */
.drop{stroke:#2a3552;stroke-width:1}
.ground{fill:#3a4766}
.gate{stroke:#3c4a66;stroke-width:1.6}
.gate.xc{stroke:#55688f}
.gate.xr{stroke:var(--accent);stroke-dasharray:5 4;opacity:.8}
.gate.route,.whl.route{stroke:var(--ok)!important;stroke-width:3.5;opacity:1;stroke-dasharray:none}
.whl{fill:none;stroke-width:2.2;stroke:var(--wh)}
.whl.reduced{stroke:var(--warn);stroke-dasharray:10 5}
.whl.critical{stroke:var(--bad);stroke-dasharray:4 4}
.whl.eol{stroke:var(--eol)}
.whl.dying{animation:whdie 1.1s ease-in-out infinite}
@keyframes whdie{0%,100%{opacity:1}50%{opacity:.08}}
.sys{cursor:pointer}
.sys .dot{stroke:#000;stroke-width:1}
.sys.ext .dot{opacity:.5}
.sys .halo{fill:none;stroke:var(--accent);stroke-width:2}
.sys .inmap{fill:none;stroke:var(--wh);stroke-width:1.4;stroke-dasharray:2 2}
.lbl{font-family:var(--body);font-size:11px;fill:#c3cde0;paint-order:stroke;stroke:#070a12;stroke-width:3px;pointer-events:none}
.lbl.ext{fill:#8b98b0;font-style:italic}
.lbl.sel{fill:var(--accent);font-weight:600;font-size:13px}
.clbl{font-family:var(--display);font-size:15px;letter-spacing:.12em;fill:#55688f;opacity:.75;pointer-events:none;text-transform:uppercase}
.me{fill:none;stroke:var(--ok);stroke-width:2.5}
.mepulse{fill:none;stroke:var(--ok);stroke-width:2;animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
.pil{font-family:var(--mono);font-size:10.5px;fill:var(--ok);paint-order:stroke;stroke:#070a12;stroke-width:3px;pointer-events:none}
.stub{font-family:var(--mono);font-size:10.5px;fill:#cdb8ff;paint-order:stroke;stroke:#070a12;stroke-width:3px;cursor:pointer}
/* Autopilot route widget */
#apBox{position:absolute;left:12px;top:12px;z-index:4;width:250px;max-height:calc(100% - 60px);display:flex;flex-direction:column;background:rgba(14,20,36,.94);border:1px solid var(--line);border-left:3px solid var(--ap);border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#apBox[hidden]{display:none}
#apHead{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:none;border-radius:0;padding:8px 10px;font-size:13px}
#apHead .car{display:inline-block;transition:transform .15s;color:var(--dim)}
#apHead[aria-expanded="false"] .car{transform:rotate(-90deg)}
#apHead b{font-family:var(--display);font-size:1.05rem;letter-spacing:.04em}
#apHead .nx{display:block;font-size:12px;color:var(--dim);font-weight:400}
#apBody{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line)}
#apBody[hidden]{display:none}
.aptools{display:flex;gap:6px;align-items:center;padding:6px 10px}
.aptools select{flex:1;font-size:12px;padding:3px 5px}
.aptools button{font-size:12px;padding:3px 8px}
#apList{list-style:none;margin:0;padding:2px 0 6px;overflow:auto;min-height:0;counter-reset:ap -1}
#apList li{display:grid;grid-template-columns:22px 34px 1fr;align-items:baseline;gap:4px;padding:2px 10px;font-size:13px;cursor:pointer;counter-increment:ap}
#apList li::before{content:counter(ap);color:var(--dim);font-family:var(--mono);font-size:11px;text-align:right}
#apList li:hover{background:var(--panel-2)}
#apList li .sc{font-family:var(--mono);font-size:12px}
#apList li .rg{display:block;font-size:11px;color:var(--dim)}
#apList li .via{font-size:11px;color:var(--eol)}
#apList li.here{background:rgba(95,214,138,.12)}
#apList li.here .nm{color:var(--ok);font-weight:600}
#apList li.here::before{content:"▶";color:var(--ok)}
#apList li.wp .nm{color:var(--ap);font-weight:600}
#apList li.dest .nm{color:var(--accent);font-weight:700}
#apList li.reg{border-top:1px dashed var(--line);margin-top:3px;padding-top:4px}
#apMsg{padding:4px 10px 8px;font-size:12px;color:var(--dim)}
.gate.ap,.whl.ap{stroke:var(--ap)!important;stroke-width:3;opacity:1;stroke-dasharray:none}
.sys .apdot{fill:none;stroke:var(--ap);stroke-width:1.5}
@media (max-width:820px){ main{grid-template-columns:1fr;grid-template-rows:1fr 40%} aside{border-left:none;border-top:1px solid var(--line)} }
</style>
</head>
<body>
<header>
  <h1><a href="../">Anoikis Traveler</a> <small>· Region</small></h1>
  <label class="dim">Region <select id="regSel" aria-label="Region"></select></label>
  <select id="whSel" aria-label="Regions with an active wormhole connection" title="Regions where your mapper has an active wormhole connection"></select>
  <input id="search" list="sysList" placeholder="Find a system…" aria-label="Find a system" size="16">
  <datalist id="sysList"></datalist>
  <label class="dim">Colour <select id="colorSel" aria-label="Colour systems by">
    <option value="auto">Auto</option><option value="sec">Security</option><option value="const">Constellation</option></select></label>
  <button id="btnFollow" type="button" aria-pressed="true" title="Switch region and recenter automatically when your character jumps">Follow me</button>
  <button id="btnTop" type="button" title="Top-down view, like the in-game map">Top view</button>
  <button id="btnReset" type="button">Recenter</button>
  <span class="grow"></span>
  <span id="who" class="dim">Not logged in</span>
  <select id="charSel" aria-label="Character" hidden></select>
  <a id="toMapper" href="../"><button type="button" class="primary">Wormhole mapper</button></a>
</header>
<main>
  <div id="stage">
    <svg id="map" aria-label="3D region map"></svg>
    <div id="banner"></div>
    <div id="apBox" hidden>
      <button id="apHead" type="button" aria-expanded="true" aria-controls="apBody"></button>
      <div id="apBody">
        <div class="aptools">
          <select id="apPref" aria-label="Route preference" title="Use the same setting as your in-game autopilot">
            <option value="Shorter">Shortest</option><option value="Safer">Safer (high-sec)</option><option value="LessSecure">Less secure</option></select>
          <button id="apClear" type="button" title="Forget this route (the in-game route is not changed)">Clear</button>
        </div>
        <ol id="apList"></ol>
        <div id="apMsg"></div>
      </div>
    </div>
    <div id="hint">Drag to rotate · Shift+drag or right-drag to pan · Wheel to zoom · Click a system</div>
    <div id="zoomBtns"><button id="zIn" type="button" aria-label="Zoom in">+</button><button id="zOut" type="button" aria-label="Zoom out">−</button></div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<div id="toast" role="status"></div>
<script>
(() => {
'use strict';
const ESI = 'https://esi.evetech.net/latest';
const SSO = 'https://login.eveonline.com/v2/oauth';
const WP_SCOPE = 'esi-ui.write_waypoint.v1';
const MAPPER = '../';
const DATA = 'data/';
const svgNS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const sess = { get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ sessionStorage.setItem(k, v); }catch(e){} } };
// Same keys as the mapper (same site, same browser storage): login, map cache and pilots are shared with it.
const CK = { tok:'whmap.tok.', me:'whmap.me.', slot:'whmap.slot.' };
function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', err ? 6000 : 2800); }
function el(tag, attrs, parent){ const e = document.createElementNS(svgNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

/* ---------- Security & constellation colours ---------- */
const SEC_COL = ['#f00000','#d73000','#f04800','#f06000','#d77700','#efef00','#8fef2f','#00f000','#00ef47','#48f0c0','#2fefef'];
const secR = s => (s > 0 && s < 0.05) ? 0.1 : Math.round(s * 10) / 10;
const secCol = s => { const r = secR(s); if (r <= 0) return r <= -0.5 ? '#a01010' : SEC_COL[0]; return SEC_COL[Math.min(10, Math.round(r * 10))]; };
const constCol = i => `hsl(${(i * 137.508) % 360} 62% 60%)`;

/* ---------- State ---------- */
let index = null;            // { regions:[{id,name,slug,n}], sys:{id:[name, regionId]} }
let R = null;                // current region data
let byId = {}, adj = {}, norm = {}, constIdx = {};
let sel = null;              // selected system id (string)
let route = null;            // { ids:[...], edges:Set }
let follow = store.get('whmap.reg.follow', true);
let colorMode = store.get('whmap.reg.color', 'auto');
const cam = { yaw:0, pitch:58 * Math.PI / 180, zoom:1, px:0, py:0, hx:1 };
let tok = null, clientId = '', me = { sys:null, name:'' };
let mapper = { nodes:{}, links:{}, pilots:{} };
const nameCache = {};

/* ---------- Data ---------- */
async function loadIndex(){
  const r = await fetch(DATA + 'index.json'); if (!r.ok) throw new Error('Region index missing');
  index = await r.json();
  index.regions.sort((a, b) => a.name.localeCompare(b.name));
  $('#regSel').innerHTML = index.regions.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('');
  $('#sysList').innerHTML = Object.entries(index.sys).map(([id, v]) => `<option value="${esc(v[0])}">`).join('');
}
const regionOf = id => { const v = index && index.sys[String(id)]; return v ? v[1] : null; };
const sysName = id => { id = String(id); return (byId[id] && byId[id].n) || (index && index.sys[id] && index.sys[id][0]) || (mapper.nodes[id] && mapper.nodes[id].name) || nameCache[id] || id; };
const isJ = id => Number(id) >= 31000000 && Number(id) < 32000000;

async function loadRegion(id, keepCam){
  id = Number(id);
  const r = await fetch(DATA + id + '.json'); if (!r.ok){ toast('No data for this region', true); return; }
  R = await r.json();
  byId = {}; adj = {}; constIdx = {};
  Object.keys(R.constellations).forEach((c, i) => constIdx[c] = i);
  for (const s of R.systems){ byId[String(s.id)] = s; adj[String(s.id)] = []; }
  for (const [a, b] of R.links){ adj[String(a)].push(String(b)); adj[String(b)].push(String(a)); }
  // normalise around the region's own systems
  const own = R.systems.filter(s => !s.ext);
  const c = own.reduce((m, s) => ({ x:m.x + s.x / own.length, y:m.y + s.y / own.length, z:m.z + s.z / own.length }), { x:0, y:0, z:0 });
  let rad = 1; for (const s of own) rad = Math.max(rad, Math.hypot(s.x - c.x, s.z - c.z, s.y - c.y));
  norm = {}; for (const s of R.systems) norm[String(s.id)] = { x:(s.x - c.x) / rad, y:(s.y - c.y) / rad, z:(s.z - c.z) / rad };
  $('#regSel').value = String(id);
  document.title = `${R.region.name} · Anoikis Traveler`;
  const slug = (index.regions.find(g => g.id === id) || {}).slug || id;
  history.replaceState(null, '', `?r=${slug}`);
  store.set('whmap.reg.last', id);
  if (!keepCam){ cam.zoom = 1; cam.px = 0; cam.py = 0; }
  if (sel && !byId[sel]) sel = null;
  computeRoute(); render(); renderPanel();
}

/* ---------- Mapper data (read-only, from the mapper's browser cache) ---------- */
function readMapper(){
  const cid = (tok && tok.charId) || store.get('whmap.lastChar', null);
  const slot = cid ? store.get(CK.slot + cid, null) : null;
  let m = slot && slot.mapOwner ? store.get('whmap.cache.' + slot.mapOwner, null) : null;
  if (!m) m = store.get('whmap.map', null);
  m = m || {};
  const objs = v => Array.isArray(v) ? Object.fromEntries(v.filter(Boolean).map(x => [x.id, x])) : (v || {});
  mapper = { nodes:m.nodes || {}, links:objs(m.links), pilots:m.pilots || {} };
}
/* Same rule as the mapper: past its estimated lifetime a wormhole blinks for 1 h, then it no longer counts.
   Lifetime by type from the mapper's wormhole data (same browser storage), 48 h if the type is unknown; 4 h after EOL. */
const whTypes = () => { const d = store.get('whmap.data2', null); return (d && d.types) || {}; };
function whPhase(l){
  const now = Date.now();
  if (l.type === 'gate') return 'ok';
  if (l.src === 'eve-scout') return l.expires && l.expires <= now ? 'dead' : 'ok';
  const t = l.wh && whTypes()[String(l.wh).toUpperCase()], out = [];
  if (l.eol && l.eolAt) out.push(l.eolAt + 4 * 3600e3);
  if (l.created) out.push(l.created + (t && t.life ? t.life : 48) * 3600e3);
  if (!out.length) return 'ok';
  const d = Math.min(...out);
  return now < d ? 'ok' : now < d + 3600e3 ? 'dying' : 'dead';
}
const whAlive = l => whPhase(l) !== 'dead';
const whLinks = () => Object.values(mapper.links).filter(l => l && l.type !== 'gate' && l.a != null && l.b != null && whPhase(l) !== 'dead');
/* Drop-down: one shortcut per region that has an active wormhole connection on the mapper, then its systems */
function renderWhSel(){
  const sel_ = $('#whSel'); if (!sel_ || !index) return;
  const byReg = {};
  for (const l of whLinks()){
    if (!whAlive(l)) continue;
    for (const [here, other] of [[l.a, l.b], [l.b, l.a]]){
      const reg = regionOf(here); if (!reg) continue;               // J-space side: no region page
      (byReg[reg] = byReg[reg] || []).push({ here:String(here), other:String(other), l });
    }
  }
  const regs = Object.keys(byReg).sort((a, b) => regionName(a).localeCompare(regionName(b)));
  const n = regs.reduce((m, r) => m + byReg[r].length, 0);
  const lab = l => [l.wh, l.size && l.size !== '?' ? l.size : '', l.eol ? 'EOL' : '', l.src === 'eve-scout' ? 'EvE-Scout' : ''].filter(Boolean).join(' ');
  sel_.innerHTML = `<option value="">${regs.length ? `⟿ WH regions (${regs.length})` : '⟿ No active wormhole'}</option>` + regs.map(r =>
    `<option class="r" value="r:${r}">${esc(regionName(r))} · ${byReg[r].length} WH</option>` +
    byReg[r].sort((a, b) => sysName(a.here).localeCompare(sysName(b.here))).map(c =>
      `<option value="s:${c.here}">\u00a0\u00a0\u00a0${esc(sysName(c.here))} → ${esc(sysName(c.other))}${lab(c.l) ? ' · ' + esc(lab(c.l)) : ''}</option>`).join('')).join('');
  sel_.disabled = !n;
  const unknown = [...new Set(regs.flatMap(r => byReg[r].map(c => c.other)))].filter(id => sysName(id) === id && !(id in nameCache)).slice(0, 15);
  if (unknown.length) Promise.all(unknown.map(async id => { await lookupName(id); if (!(id in nameCache)) nameCache[id] = id; })).then(renderWhSel);
}
const pilotsAt = id => Object.values(mapper.pilots).filter(p => p && String(p.sys) === String(id) && (!p.t || Date.now() - p.t < 30 * 60000));

/* ---------- EVE login (shared with the mapper) ---------- */
function jwt(t){ try{ return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); }catch(e){ return {}; } }
const scopes = () => { if (!tok) return []; const s = jwt(tok.access_token).scp; return Array.isArray(s) ? s : (s ? [s] : []); };
const canWp = () => scopes().includes(WP_SCOPE);
function vaultChars(){
  const out = [];
  try{ for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith(CK.tok)){ const t = store.get(k, null); if (t && t.charId) out.push(t); } } }catch(e){}
  return out.sort((a, b) => String(a.charName).localeCompare(String(b.charName)));
}
function pickChar(){
  const chars = vaultChars();
  let id = Number(sess.get('whmap.tabChar')) || store.get('whmap.lastChar', null);
  if (!chars.some(c => c.charId === id)) id = chars.length ? chars[0].charId : null;
  tok = id ? store.get(CK.tok + id, null) : null;
  if (id) sess.set('whmap.tabChar', String(id));
  const cs = $('#charSel');
  cs.hidden = chars.length < 2;
  cs.innerHTML = chars.map(c => `<option value="${c.charId}"${c.charId === id ? ' selected' : ''}>${esc(c.charName)}</option>`).join('');
  const cached = id ? store.get(CK.me + id, null) : null;
  me = { sys:cached && cached.current != null && /^\d+$/.test(String(cached.current)) ? String(cached.current) : null, name:tok ? tok.charName : '' };
}
async function getClientId(){
  if (clientId) return clientId;
  const c = store.get('whmap.cfg', {}); if (c && c.clientId) return clientId = c.clientId;
  try{ const r = await fetch(MAPPER + 'site.json', { cache:'no-store' }); if (r.ok){ const j = await r.json(); if (j.clientId) clientId = j.clientId; } }catch(e){}
  return clientId;
}
async function withLock(name, fn){ return navigator.locks && navigator.locks.request ? navigator.locks.request(name, fn) : fn(); }
async function ensureToken(){
  if (!tok) throw new Error('Not logged in');
  const latest = store.get(CK.tok + tok.charId, null);
  if (!latest){ tok = null; throw new Error('Logged out in the mapper'); }

function graph(){

  for (const [a, b] of R.links) add(String(a), String(b), 'g:' + [a, b].sort().join('-'));

let W = 800, H = 600;
function proj(p){

  const tx = W / 2 - q.x, ty = H / 2 - q.y;

  if (!ap.dests.length){
    if (changed || !ap.arrived) ap.arrived = me.sys;
    ap.path = [me.sys]; ap.err = ''; apSave(); renderAp(); render(); return;
  }
  ap.arrived = null;
  if (changed) apSave();
  if (!force && ap.path){
    const i = ap.path.indexOf(me.sys), w = ap.path.indexOf(ap.dests[0]);
    // still on the route, before the next waypoint: just trim
    if (i >= 0 && (w < 0 || i <= w)){ ap.path = ap.path.slice(i); renderAp(); render(); return; }
  }
  const my = ++apSeq;
  ap.err = ''; ap.busy = true; renderAp();
  try{
    const conns = whConns(); let from = me.sys; const path = [me.sys];
    for (const d of ap.dests){ const seg = await esiRoute(from, d, ap.pref, conns); path.push(...seg.slice(seg[0] === from ? 1 : 0)); from = d; }
    if (my !== apSeq) return;
    ap.path = path;
  }catch(e){ if (my !== apSeq) return; ap.path = null; ap.err = `No route found (${e.message}).`; }
  ap.busy = false; ap.whp = apWhPairs();
  await Promise.all((ap.path || []).filter(id => !index.sys[id] && !byId[id] && !nameCache[id] && !(mapper.nodes[id] && mapper.nodes[id].name)).slice(0, 20).map(lookupName));
  renderAp(); render();
}
const scheduleAp = () => { if (!ap) return; clearTimeout(apT); apT = setTimeout(() => computeAp(true), 1200); };
function secOf(id){ const s = byId[id] ? byId[id].s : index.sys[id] ? index.sys[id][2] : null; return s; }
function apSetFrom(id, add){
  if (!add || !ap || !ap.dests.length) ap = { dests:[String(id)], pref:(ap && ap.pref) || store.get('whmap.reg.pref', 'Shorter'), open:ap ? ap.open !== false : true };
  else if (ap.dests[ap.dests.length - 1] !== String(id)) ap.dests.push(String(id));
  ap.path = null; apSave(); computeAp(true);
}
function renderAp(){
  const box = $('#apBox');
  if (!ap){ box.hidden = true; return; }
  box.hidden = false;
  const open = ap.open !== false;
  const path = ap.path || [], whp = ap.whp || {};
  const fin = ap.dests.length ? ap.dests[ap.dests.length - 1] : ap.arrived;
  const head = $('#apHead');
  head.setAttribute('aria-expanded', String(open));
  if (!ap.dests.length && ap.arrived) head.innerHTML = `<span class="car">▾</span><span>Arrived · <b>${esc(sysName(ap.arrived))}</b></span>`;
  else {
    const jumps = Math.max(0, path.length - 1), nx = path[1];
    const via = nx && whp[pairKey(path[0], nx)] ? ` <span class="via">via ${esc(whp[pairKey(path[0], nx)])}</span>` : '';
    head.innerHTML = `<span class="car">▾</span><span><b>${ap.busy && !path.length ? '…' : jumps + ' jump' + (jumps > 1 ? 's' : '')}</b> → ${esc(sysName(fin))}`
      + `${nx ? `<span class="nx">Next: ${esc(sysName(nx))}${via}</span>` : ''}</span>`;
  }
  $('#apBody').hidden = !open;
  $('#apPref').value = ap.pref || 'Shorter';
  let prevReg = null;
  $('#apList').innerHTML = path.map((id, i) => {
    const s = secOf(id), reg = isJ(id) ? 'J-space' : regionName(regionOf(id) || '') || '';
    const cls = [i === 0 && id === me.sys ? 'here' : '', id === fin ? 'dest' : ap.dests.includes(id) ? 'wp' : '', i > 0 && reg !== prevReg ? 'reg' : ''].filter(Boolean).join(' ');
    const showReg = i === 0 || reg !== prevReg; prevReg = reg;
    const w = i > 0 && whp[pairKey(path[i - 1], id)];
    const node = mapper.nodes[id];
    const sc = s != null ? `<span class="sc" style="color:${secCol(s)}">${secR(s).toFixed(1)}</span>` : `<span class="sc" style="color:var(--eol)">${esc(node && node.cls ? String(node.cls).toUpperCase() : 'WH')}</span>`;
    return `<li class="${cls}" data-sys="${id}" title="${esc(sysName(id))}">${sc}<span><span class="nm">${esc(sysName(id))}</span>${w ? ` <span class="via">⟿ ${esc(w)}</span>` : ''}${showReg && reg ? `<span class="rg">${esc(reg)}</span>` : ''}</span></li>`;
  }).join('');
  const usesWh = path.some((id, i) => i > 0 && whp[pairKey(path[i - 1], id)]);
  $('#apMsg').textContent = ap.err || (ap.busy ? 'Calculating…' : usesWh ? 'The in-game autopilot does not know wormholes: it may show another route. Jump the ⟿ holes yourself.' : '');
  $('#apList').querySelectorAll('li').forEach(li => li.addEventListener('click', () => goTo(li.dataset.sys)));
  const here = $('#apList li.here'); if (here && open) here.scrollIntoView({ block:'nearest' });
}
function apPairsSet(){ const set = new Set(); const p = ap && ap.path; if (p) for (let i = 1; i < p.length; i++) set.add(pairKey(p[i - 1], p[i])); return set; }

/* ---------- Interaction ---------- */
function setupInput(){
  const svg = $('#map');
  const ptrs = new Map(); let start = null, moved = false, pinch = null;
  svg.addEventListener('contextmenu', e => e.preventDefault());
  svg.addEventListener('pointerdown', e => {
    svg.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch = { d:Math.hypot(a.x - b.x, a.y - b.y), z:cam.zoom }; }
    start = { x:e.clientX, y:e.clientY, pan:e.shiftKey || e.button === 2 || e.button === 1, target:e.target.closest('.sys') };
    moved = false;
  });
  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (ptrs.size === 2 && pinch){ const [a, b] = [...ptrs.values()]; cam.zoom = Math.max(0.3, Math.min(12, pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d)); moved = true; render(); return; }
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    if (!moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 4) return;
    moved = true; svg.classList.add('dragging');
    if (start.pan){ cam.px += dx; cam.py += dy; }
    else { cam.yaw += dx * 0.008; cam.pitch = Math.max(0.05, Math.min(Math.PI / 2, cam.pitch - dy * 0.008)); }
    render();
  });
  const up = e => {
    ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
    svg.classList.remove('dragging');
    if (!moved && start && ptrs.size === 0){ select(start.target ? start.target.dataset.id : null); }
    if (ptrs.size === 0) start = null;
  };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  svg.addEventListener('dblclick', e => { const g = e.target.closest('.sys'); if (g){ centerOn(g.dataset.id); render(); } });
  svg.addEventListener('keydown', e => { const g = e.target.closest && e.target.closest('.sys'); if (g && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); select(g.dataset.id); } });
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const b = svg.getBoundingClientRect(), f = Math.exp(-e.deltaY * 0.0015);
    const z2 = Math.max(0.3, Math.min(12, cam.zoom * f)), k = z2 / cam.zoom;
    const cx = e.clientX - b.left - W / 2, cy = e.clientY - b.top - H / 2;
    cam.px = cx - (cx - cam.px) * k; cam.py = cy - (cy - cam.py) * k; cam.zoom = z2; render();
  }, { passive:false });
  const zoomBy = f => { cam.px *= f; cam.py *= f; cam.zoom = Math.max(0.3, Math.min(12, cam.zoom * f)); render(); };
  $('#zIn').onclick = () => zoomBy(1.3); $('#zOut').onclick = () => zoomBy(1 / 1.3);
  $('#btnReset').onclick = () => { cam.zoom = 1; cam.px = 0; cam.py = 0; cam.yaw = 0; cam.pitch = 58 * Math.PI / 180; if (me.sys && byId[me.sys]) centerOn(me.sys); render(); };
  $('#btnTop').onclick = () => { cam.yaw = 0; cam.pitch = Math.PI / 2; render(); };
  $('#regSel').onchange = e => { sel = null; loadRegion(e.target.value); };
  $('#whSel').onchange = async e => {
    const v = e.target.value; e.target.value = ''; if (!v) return;
    follow = false; store.set('whmap.reg.follow', false); $('#btnFollow').setAttribute('aria-pressed', 'false');
    if (v.startsWith('r:')){ sel = null; await loadRegion(v.slice(2)); }
    else await goTo(v.slice(2));
  };
  $('#colorSel').value = colorMode;
  $('#colorSel').onchange = e => { colorMode = e.target.value; store.set('whmap.reg.color', colorMode); render(); };
  const fb = $('#btnFollow'); fb.setAttribute('aria-pressed', String(follow));
  fb.onclick = () => { follow = !follow; store.set('whmap.reg.follow', follow); fb.setAttribute('aria-pressed', String(follow)); if (follow) onMove(); };
  $('#search').addEventListener('change', e => {
    const q = e.target.value.trim().toLowerCase(); if (!q) return;
    const hit = Object.entries(index.sys).find(([, v]) => v[0].toLowerCase() === q) || Object.entries(index.sys).find(([, v]) => v[0].toLowerCase().startsWith(q));
    if (hit){ follow = false; store.set('whmap.reg.follow', false); fb.setAttribute('aria-pressed', 'false'); goTo(hit[0]); e.target.value = ''; }
    else toast('No system called ' + e.target.value, true);
  });
  $('#charSel').onchange = e => { sess.set('whmap.tabChar', e.target.value); store.set('whmap.lastChar', Number(e.target.value)); pickChar(); readMapper(); renderWhSel(); apLoad(); renderWho(); poll(); render(); renderPanel(); computeAp(true); };
  // the mapper (other tab) updates its cache, pilots and tokens: follow along
  window.addEventListener('storage', e => {
    if (!e.key || !e.key.startsWith('whmap.')) return;
    if (e.key.startsWith('whmap.cache.') || e.key === 'whmap.map'){ readMapper(); renderWhSel(); computeRoute(); render(); renderPanel(); scheduleAp(); }
    else if (e.key.startsWith(CK.tok) && !tok){ pickChar(); renderWho(); poll(); }
  });
  $('#apHead').onclick = () => { if (!ap) return; ap.open = ap.open === false; apSave(); renderAp(); };
  $('#apPref').onchange = e => { if (!ap) return; ap.pref = e.target.value; store.set('whmap.reg.pref', ap.pref); apSave(); computeAp(true); };
  $('#apClear').onclick = () => { ap = null; apSave(); renderAp(); render(); };
  window.addEventListener('resize', render);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
}

/* ---------- Start ---------- */
(async function init(){
  try{ await loadIndex(); }catch(e){ $('#panel').innerHTML = `<p>${esc(e.message)}</p>`; return; }
  pickChar(); readMapper(); apLoad(); setupInput(); renderWho(); renderWhSel();
  setInterval(() => { renderWhSel(); render(); }, 60000);   // holes age out even without a mapper change
  const q = new URLSearchParams(location.search);
  const qr = q.get('r'), qs = q.get('sys');
  let reg = null;
  if (qr){ const g = index.regions.find(x => x.slug === qr.toLowerCase() || String(x.id) === qr || x.name.toLowerCase() === qr.toLowerCase()); if (g) reg = g.id; }
  if (!reg && qs && regionOf(qs)) reg = regionOf(qs);
  if (!reg && me.sys && regionOf(me.sys)) reg = regionOf(me.sys);
  if (!reg) reg = store.get('whmap.reg.last', null);
  if (!reg || !index.regions.some(g => g.id === reg)) reg = (index.regions.find(g => g.slug === 'insmother') || index.regions[0]).id;
  if (qs){ follow = false; $('#btnFollow').setAttribute('aria-pressed', 'false'); }   // a system link is a deliberate look elsewhere
  await loadRegion(reg);
  if (qs && byId[qs]){ select(qs); centerOn(qs); }
  else if (me.sys && byId[me.sys]) centerOn(me.sys);
  render(); computeAp(true);
  poll();
})();
})();
</script>
